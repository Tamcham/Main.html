<!doctype html>
<html lang="de" data-hc="0" data-rm="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
<meta name="theme-color" content="#060a15">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Macht &amp; Mandat – Vom Rathaus ins Kanzleramt</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#060a15; --bg2:#0c1530; --navy:#13224d; --navy2:#1b2f66;
  --gold:#d6b16c; --gold2:#f3d99b; --gold3:#8f7238;
  --ink:#eef1f8; --mut:#9ba7c6; --line:rgba(214,177,108,.30); --glass:rgba(255,255,255,.065); --glass2:rgba(255,255,255,.11);
  --good:#72d39b; --bad:#ff7b7b; --warn:#f3c25c;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fs:16px; --r:18px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
html[data-hc="1"]{--bg:#000;--bg2:#050505;--ink:#fff;--mut:#d7deef;--line:rgba(255,217,138,.85);--glass:rgba(255,255,255,.14);--glass2:rgba(255,255,255,.22);--gold:#ffd98a;--gold2:#fff0c4}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#02040a;color:var(--ink);font-family:var(--sans);overscroll-behavior:none;min-height:100vh}
#app{position:relative;max-width:520px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(120% 70% at 50% -10%,var(--navy2) 0%,var(--bg2) 38%,var(--bg) 100%);box-shadow:0 0 80px rgba(0,0,0,.6)}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(1px 1px at 20% 30%,rgba(243,217,155,.5),transparent),radial-gradient(1px 1px at 70% 60%,rgba(243,217,155,.35),transparent),radial-gradient(1.5px 1.5px at 40% 85%,rgba(243,217,155,.3),transparent)}
#topbar{position:relative;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:calc(6px + var(--safe-t)) 14px 0 18px;min-height:calc(46px + var(--safe-t))}
#topbar .logo{font-size:.72rem;letter-spacing:.3em;color:var(--gold);opacity:.85}
#screen{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 16px 20px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
#screen.noscroll{overflow:hidden;display:flex;flex-direction:column;padding-bottom:8px}
#nav{display:none;padding:8px 10px calc(8px + var(--safe-b));background:linear-gradient(180deg,rgba(6,10,21,.3),rgba(6,10,21,.92));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);gap:6px}
#nav.on{display:flex}
#nav button{flex:1;min-height:54px;border:0;border-radius:14px;background:transparent;color:var(--mut);font:600 .72rem var(--sans);letter-spacing:.04em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#nav button span{font-size:1.25rem;line-height:1}
#nav button.act{color:var(--gold2);background:var(--glass)}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:.01em}
h1{font-size:2rem;line-height:1.1}h2{font-size:1.45rem;line-height:1.2}h3{font-size:1.1rem}
p{line-height:1.5;margin:.4em 0}
.gold{color:var(--gold2)} .mut{color:var(--mut)} .small{font-size:.82rem} .tiny{font-size:.7rem}
.serif{font-family:var(--serif)} .caps{text-transform:uppercase;letter-spacing:.14em;font-size:.68rem;color:var(--gold)}
.center{text-align:center} .row{display:flex;gap:10px;align-items:center} .sp{justify-content:space-between} .wrap{flex-wrap:wrap}
.grow{flex:1} .mt{margin-top:14px} .mt2{margin-top:24px} .mb{margin-bottom:12px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:14px}
.glass.tight{padding:10px}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);border:0;margin:14px 0;opacity:.7}
.btn{appearance:none;border:0;min-height:52px;width:100%;padding:12px 18px;border-radius:16px;font:700 1rem var(--sans);letter-spacing:.02em;color:#1a1204;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,var(--gold3));box-shadow:0 6px 22px rgba(214,177,108,.25),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97);filter:brightness(.95)}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.small{min-height:44px;width:auto;padding:8px 14px;font-size:.88rem}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:.75rem;color:var(--mut)}
.chip.on{background:rgba(214,177,108,.18);color:var(--gold2);border-color:var(--gold)}
.logo{font-family:var(--serif);letter-spacing:.06em}
/* Start */
.hero{min-height:calc(100dvh - 120px);display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center}
.hero .crest{width:96px;height:96px;margin:0 auto;filter:drop-shadow(0 6px 24px rgba(214,177,108,.4))}
.hero h1{font-size:2.35rem;background:linear-gradient(180deg,#fff3cf,var(--gold) 60%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{font-family:var(--serif);font-style:italic;color:var(--mut);font-size:1.05rem}
.fadein{animation:fadein .6s ease both}@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* Party cards */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{position:relative;text-align:left;padding:12px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,var(--glass2),var(--glass));min-height:112px;color:var(--ink);font-family:var(--sans);overflow:hidden}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--pc)}
.pcard .pn{font:700 1.25rem var(--serif);margin-left:6px}
.pcard .ps{font-size:.72rem;color:var(--mut);margin:2px 0 6px 6px;line-height:1.3}
.pcard .stars{margin-left:6px;color:var(--gold);letter-spacing:2px;font-size:.8rem}
.pcard.sel{outline:2px solid var(--gold2);box-shadow:0 0 28px rgba(214,177,108,.3)}
.badge{display:inline-flex;min-width:34px;height:30px;padding:0 5px;border-radius:9px;align-items:center;justify-content:center;font:800 .68rem var(--sans);letter-spacing:-.02em;flex:none;color:#0a0a0a;background:var(--pc);border:1px solid rgba(255,255,255,.35)}
.badge.lg{min-width:54px;height:54px;border-radius:15px;font-size:.95rem}
/* inputs */
label.f{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:14px 0 6px}
input[type=text],select,textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);font:1rem var(--sans)}
input[type=range]{width:100%;height:36px;accent-color:var(--gold)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:600 .85rem var(--sans)}
.opt.on{background:linear-gradient(180deg,rgba(243,217,155,.3),rgba(214,177,108,.2));border-color:var(--gold2);color:var(--gold2)}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid transparent;padding:0}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--gold)}
/* stats */
.meter{display:flex;flex-direction:column;gap:4px}
.meter .lab{display:flex;justify-content:space-between;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.bar{height:9px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold3),var(--gold2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.g i{background:linear-gradient(90deg,#3a9d6c,var(--good))}
.bar.r i{background:linear-gradient(90deg,#b34a4a,var(--bad))}
.bar.tall{height:16px}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.delta{font-weight:700}.delta.up{color:var(--good)}.delta.dn{color:var(--bad)}
/* decision card */
.cardscreen{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.stage{position:relative;flex:1 1 auto;min-height:150px;touch-action:pan-y}
.dcard{position:absolute;inset:0;border-radius:24px;padding:14px 16px 12px;display:flex;flex-direction:column;
  background:linear-gradient(170deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid var(--line);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s;will-change:transform;user-select:none;-webkit-user-select:none}
.dcard.behind{transform:scale(.94) translateY(16px);opacity:.5;pointer-events:none}
.dcard .ico{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.45rem;flex:none;background:linear-gradient(145deg,var(--navy2),var(--navy));border:1px solid var(--gold3)}
.dcard h2{margin:8px 0 4px;font-size:1.3rem}
.dcard .body{flex:1;overflow-y:auto;font-size:.94rem;line-height:1.45;color:#dfe5f5}
.dcard .body .q{font-family:var(--serif);font-style:italic;color:var(--gold2);margin-top:10px;font-size:1.05rem}
.swl{position:absolute;top:16px;padding:6px 12px;border:2px solid;border-radius:10px;font:800 .8rem var(--sans);letter-spacing:.1em;opacity:0;text-transform:uppercase;background:rgba(0,0,0,.4)}
.swl.l{left:14px;border-color:var(--bad);color:var(--bad);transform:rotate(-8deg)}
.swl.r{right:14px;border-color:var(--good);color:var(--good);transform:rotate(8deg)}
.ochoices{display:flex;flex-direction:column;gap:7px;margin-top:2px;flex:none}
.noscroll .ochoices{max-height:48vh;overflow-y:auto}
.oc{position:relative;text-align:left;min-height:54px;padding:9px 13px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--ink);font:600 .92rem/1.25 var(--sans)}
.oc:active{transform:scale(.98);background:rgba(214,177,108,.15)}
.oc .pv{display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto;margin-top:5px;font-size:.66rem;font-weight:700;scrollbar-width:none}
.oc .pv::-webkit-scrollbar{display:none}
.pv b{white-space:nowrap}
.pv b{padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.08);font-weight:700}
.pv b.u{color:var(--good)}.pv b.d{color:var(--bad)}.pv b.q{color:var(--mut)}
.risk{font-size:.68rem;color:var(--warn);margin-top:4px;letter-spacing:.04em}
.oc[disabled]{opacity:.4}
/* result */
.resbox{animation:fadein .4s ease both}
.hl{padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.35);border-left:3px solid var(--gold);margin:8px 0;font-size:.9rem;line-height:1.35}
.hl .src{display:block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.hl.b{border-left-color:var(--bad)} .hl.s{border-left-color:#6aa7ff}
.hl.pos{border-left-color:var(--good)}
/* poll */
.tabs{display:flex;gap:6px;margin:6px 0 12px}
.tab{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--mut);font:700 .82rem var(--sans)}
.tab.on{background:rgba(214,177,108,.2);color:var(--gold2);border-color:var(--gold)}
.brow{display:grid;grid-template-columns:66px 1fr 62px;gap:8px;align-items:center;margin:7px 0}
.brow .nm{font:700 .82rem var(--sans);display:flex;align-items:center;gap:6px}
.brow .track{height:22px;border-radius:7px;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
.brow .fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--pc);transition:width .9s cubic-bezier(.2,.8,.2,1);min-width:2px}
.brow .err{position:absolute;top:50%;height:2px;background:#fff;opacity:.75;transform:translateY(-50%)}
.brow .val{text-align:right;font:700 .9rem var(--sans);font-variant-numeric:tabular-nums}
.brow .val small{display:block;font-size:.62rem;color:var(--mut);font-weight:500}
.hurdle{position:absolute;top:-2px;bottom:-2px;width:0;border-left:2px dashed var(--bad)}
.cb .fill{background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.28) 0 4px,transparent 4px 9px)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.7rem;color:var(--mut)}
svg text{font-family:var(--sans)}
/* cutscene */
.cut{position:absolute;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
.cut .view{position:relative;flex:1;overflow:hidden;margin:7% 0}
.cut .scene svg{width:100%;height:100%;display:block}
.cut .scene{position:absolute;inset:-5%;transition:transform 5.5s cubic-bezier(.3,.1,.3,1),filter 1s}
.cut .lb{position:absolute;left:0;right:0;height:8%;background:#000;z-index:3}
.cut .lb.t{top:0}.cut .lb.b{bottom:0}
.cut .sub{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:16px 18px calc(18px + var(--safe-b));background:linear-gradient(0deg,rgba(0,0,0,.9),transparent);min-height:120px}
.cut .sub .who{font:700 .7rem var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.cut .sub .txt{font:1.12rem/1.45 var(--serif);margin-top:4px;min-height:3em}
.cut .skip{position:absolute;top:calc(10px + var(--safe-t));right:12px;z-index:6;min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.5);color:var(--ink);font:600 .78rem var(--sans)}
.cut .tick{position:absolute;left:0;right:0;top:12%;z-index:4;background:rgba(150,20,20,.92);color:#fff;font:700 .78rem var(--sans);letter-spacing:.05em;padding:6px 10px;white-space:nowrap;overflow:hidden;text-transform:uppercase}
.cut .tick span{display:inline-block;animation:tick 14s linear infinite;padding-left:100%}
@keyframes tick{to{transform:translateX(-100%)}}
.cut .chars{position:absolute;left:0;right:0;bottom:92px;display:flex;justify-content:center;align-items:flex-end;gap:0;z-index:2}
.cut .chars svg{width:46%;max-width:230px;height:auto;filter:drop-shadow(0 10px 20px rgba(0,0,0,.7));transition:transform .5s}
.cut .chars svg.speak{transform:translateY(-8px) scale(1.04)}
.cut .chars svg.dim{filter:brightness(.55) drop-shadow(0 10px 20px rgba(0,0,0,.7))}
.cut .hint{position:absolute;right:16px;bottom:6px;z-index:6;font-size:.68rem;color:var(--mut);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.flash{animation:flash .5s}@keyframes flash{from{filter:brightness(2.4)}to{filter:none}}
/* election */
.clock{font:800 2.4rem var(--serif);letter-spacing:.05em;color:var(--gold2);text-align:center}
.tvframe{border:1px solid var(--line);border-radius:18px;padding:12px;background:linear-gradient(180deg,rgba(10,20,60,.9),rgba(5,10,30,.95));box-shadow:inset 0 0 40px rgba(60,100,255,.15)}
.tvframe .tvh{display:flex;justify-content:space-between;align-items:center;font:700 .68rem var(--sans);letter-spacing:.12em;text-transform:uppercase;color:#9cc0ff;margin-bottom:6px}
.live{display:inline-flex;align-items:center;gap:5px;color:#ff6b6b}.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#ff4b4b;animation:blink 1s infinite}
.dgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:8px}
.dgrid div{aspect-ratio:1;border-radius:6px;background:rgba(255,255,255,.08);transition:background .5s,transform .3s;display:flex;align-items:center;justify-content:center;font:700 .55rem var(--sans);color:rgba(0,0,0,.6)}
.dgrid div.on{transform:scale(1.04)}
.ticker{font-size:.78rem;color:#cfd8f6;background:rgba(0,0,0,.35);border-radius:10px;padding:8px 10px;margin-top:8px;min-height:2.6em}
/* speech */
.plenum{width:100%;height:auto;display:block}
.plenum circle{transition:r .2s,opacity .2s}
.plenum .pulse{animation:pulse .7s ease 1}
@keyframes pulse{50%{opacity:.25}}
.timer{height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--bad),var(--warn));transform-origin:left}
.zw{border:1px solid var(--bad);background:rgba(120,20,20,.25);border-radius:14px;padding:10px 12px;margin:8px 0;animation:fadein .25s both}
.banner{position:absolute;left:14px;right:14px;top:58px;z-index:60;padding:10px 16px;border-radius:14px;background:rgba(0,0,0,.88);border:1px solid var(--gold);color:var(--gold2);font:700 .88rem var(--sans);animation:fadein .3s both;text-align:center;pointer-events:none}
/* sheet & toast */
#sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end}
#sheetbg.on{display:flex}
#sheet{width:100%;max-height:88%;overflow-y:auto;background:linear-gradient(180deg,#14214a,#0a1128);border-top:1px solid var(--gold);border-radius:24px 24px 0 0;padding:18px 16px calc(20px + var(--safe-b));animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);z-index:70;background:rgba(0,0,0,.88);border:1px solid var(--gold);color:var(--gold2);padding:10px 16px;border-radius:14px;font:600 .85rem var(--sans);opacity:0;pointer-events:none;transition:opacity .3s;max-width:88%;text-align:center}
#toast.on{opacity:1}
.gear{width:44px;height:44px;flex:none;border-radius:50%;background:var(--glass);border:1px solid var(--line);color:var(--gold2);font-size:1.2rem}
.avwrap{background:radial-gradient(circle at 50% 30%,#22386e,#0a1330);border:1px solid var(--line);border-radius:22px;padding:6px;display:flex;justify-content:center}
.avwrap svg{width:min(62%,250px);height:auto}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:.88rem}
.kv:last-child{border-bottom:0}
ul.clean{margin:.3em 0;padding-left:1.1em}ul.clean li{margin:.2em 0;line-height:1.4}
.stepper{display:flex;gap:4px;margin-bottom:10px}.stepper i{flex:1;height:4px;border-radius:9px;background:rgba(255,255,255,.12)}.stepper i.on{background:var(--gold)}
.pts{font:700 1rem var(--serif);color:var(--gold2)}
.attr{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:8px 0}
.attr .pm{display:flex;gap:6px;align-items:center}
.attr .pm button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:700 1.2rem var(--sans)}
.attr .pm span{min-width:30px;text-align:center;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
html[data-rm="1"] *{animation-duration:.01ms!important;transition-duration:.01ms!important}

.opts.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.opts.scroll::-webkit-scrollbar{display:none}.opts.scroll .opt{white-space:nowrap}

</style>
</head>
<body>
<div id="app">
  <header id="topbar"><span class="logo">MACHT &amp; MANDAT</span><button class="gear" id="gear" aria-label="Einstellungen" data-act="settings">⚙</button></header>
  <main id="screen" aria-live="polite"></main>
  <nav id="nav" aria-label="Hauptnavigation"></nav>
  <div id="sheetbg"><div id="sheet" role="dialog" aria-modal="true"></div></div>
  <div id="toast" role="status"></div>
</div>
<script>
/* ===== 00-util.js ===== */
'use strict';
/* ---------- Helfer ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const rnd = () => Math.random();
const pick = a => a[Math.floor(rnd() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const gauss = () => { let u = 0; while (!u) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd()); };
const f1 = x => (Math.round(x * 10) / 10).toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

const SET_KEY = 'mum.settings.v1', SAVE_KEY = 'mum.save.v1';
const SET = Object.assign({ fs: 16, hc: 0, cb: 0, haptic: 1, voice: 0, rm: 0 }, (() => { try { return JSON.parse(localStorage.getItem(SET_KEY)) || {}; } catch (e) { return {}; } })());
function applySettings() {
  const r = document.documentElement;
  r.style.setProperty('--fs', SET.fs + 'px');
  r.dataset.hc = SET.hc; r.dataset.rm = SET.rm;
  document.body.classList.toggle('cb', !!SET.cb);
  try { localStorage.setItem(SET_KEY, JSON.stringify(SET)); } catch (e) {}
}
function buzz(ms) { if (SET.haptic && navigator.vibrate) try { navigator.vibrate(ms || 12); } catch (e) {} }
function speak(t) {
  if (!SET.voice || !window.speechSynthesis) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'de-DE'; u.rate = 1.02; speechSynthesis.speak(u); } catch (e) {}
}

function closeSheet() { $('#sheetbg').classList.remove('on'); }

function districtMix(type, idx) {
  const r = seeded(hashStr(type + idx));
  const w = MILIEUS.map(m => m.share * (m.id === type ? 4.2 : 0.55) * (0.8 + r() * .5));
  const s = w.reduce((a, b) => a + b, 0);
  return w.map(x => x / s);
}

function mediaReaction(frame, party, risky, opts) {
  // Jede Redaktion bewertet denselben Frame je nach Parteihaltung, Tonlage und Skandalrisiko unterschiedlich
  const st = FRAMES[frame].st[PIDX[party]];
  const out = []; let score = 0;
  OUTLETS.forEach(o => {
    const x = (st + o.bias + (risky ? -.25 : 0) + gauss() * .18) * o.amp;
    const tone = x > .22 ? 'pos' : x < -.22 ? 'neg' : 'neu';
    const line = pick(HL[frame][tone]).replace(/\{n\}/g, G.nn).replace(/\{o\}/g, TOWN.name);
    out.push({ outlet: o, tone, text: o.wrap(line) });
    score += tone === 'pos' ? 1 : tone === 'neg' ? -1 : 0;
  });
  return { out, score, st };
}

/* ---------- Gegnerfeld ---------- */

function campaignBoost() {
  // Wirkung: abnehmender Grenznutzen (Log) je Kanal, gewichtet nach Milieu; tanh begrenzt die Gesamtwirkung
  const out = MI.map(() => 0);
  CHANNELS.forEach(ch => {
    let spend = (G.camp.k && G.camp.k[ch.id]) || 0;
    let eff = Math.log(1 + spend / 4);
    if (G.party === 'LINKE' && ch.id === 'str') eff *= 1.5;
    MI.forEach((m, g) => { out[g] += eff * ch.w[g]; });

}

/* ---------- Kandidat:innen-Modell ---------- */
function playerCand() {
  const P = PARTIES[G.party];

}
function candList() {

/* Modellparameter (Balancing): A Parteiaffinität, P Themenprofil, C Persönlichkeit, I Amtsbonus, R Bekanntheit */
const LM = { A: .8, P: 3.0, C: 1.9, I: .35, R: .9, B: .42 };
/* Kalibrierungs-Offset je Partei (nur Spieler:in): Ziel-Siegquoten bei Zufallsspiel, siehe docs/07-balancing.md */
const HCAP = { CDU: -.1, CSU: -.4, SPD: -.2, GRUENE: .1, FDP: .45, LINKE: .2, BSW: -.25, AFD: .65, EIGEN: -.1, BUERGER: 0 };
function utility(c, g, stich, ci) {
  const sal = MILIEUS[g].sal;
  let prof = 0; for (let t = 0; t < 6; t++) prof += sal[t] * (c.prof[t] - .45);
  let u = LM.A * c.pw * c.aff[g] + LM.P * prof + LM.C * c.pers + LM.I * c.inc + LM.R * (c.recog - .5) + c.boost[g] + (c.me ? (HCAP[c.party] || 0) : 0);
  if (c.party === 'AFD' && stich) u -= .45;   // Kooperationssperre: Wähler:innen anderer Bewerber geben seltener an AfD-Kandidaturen weiter
  return u;
}
const TURN = { jung: .42, fam: .55, sen: .68, gew: .55, dorf: .62, arb: .45 };
function runVote(cands, noise, stich) {
  // pro Bezirk: Stimmen je Kandidat; Multinomial-Logit je Milieu, gemischt nach Bezirkszusammensetzung und Wahlbeteiligung
  const C = cands.length;
  const mob = 1 + G.mob;
  const pm = MILIEUS.map((m, g) => {
    const ex = cands.map(c => Math.exp(utility(c, g, stich)));
    const s = ex.reduce((a, b) => a + b, 0);
    return ex.map(x => x / s);
  });
  const districts = DISTRICTS.map((d, di) => {
    const v = new Array(C).fill(0);
    for (let g = 0; g < 6; g++) {
      const turn = clamp(TURN[MI[g]] * mob * (stich ? .86 : 1), .2, .9);
      for (let c = 0; c < C; c++) {
        // Bezirks-Rauschen wirkt als Faktor auf die Kandidatenwahrscheinlichkeit
        const nz = noise ? Math.exp(noise[di][c] || 0) : 1;
        v[c] += d.mix[g] * turn * pm[g][c] * nz;
      }
    }
    const s = v.reduce((a, b) => a + b, 0);
    const tot = d.size * 100 * (s);
    return { v: v.map(x => x / s * tot), tot, name: d.n, size: d.size };
  });
  const total = new Array(C).fill(0); let all = 0;
  districts.forEach(d => d.v.forEach((x, c) => { total[c] += x; all += x; }));
  return { districts, total, shares: total.map(x => x / all * 100), all };
}
function expectedShares() { return runVote(candList(), null, false).shares; }

/* ---------- Wahlabend: Prognose & Hochrechnungen ---------- */
function makeElection(stich, cands) {
  const c = cands || candList();
  const noise = stich ? G.noise2 : G.noise;
  const res = runVote(c, noise, stich);
  const order = DISTRICTS.map((d, i) => ({ i, k: d.size * (.65 + rnd() * .7) })).sort((a, b) => a.k - b.k).map(o => o.i);
  const prog = res.shares.map(x => x + gauss() * 2.0);
  const ps = prog.reduce((a, b) => a + Math.max(0.5, b), 0);
  return { stich: !!stich, cands: c, res, order, prog: prog.map(x => Math.max(.5, x) * 100 / ps), turnout: res.all / (DISTRICTS.reduce((a, d) => a + d.size * 100, 0)) };
}
const HR_STEPS = [
  { t: '18:00', n: 'Prognose', f: 0 }, { t: '18:45', n: '1. Hochrechnung', f: .22 }, { t: '19:30', n: '2. Hochrechnung', f: .46 },
  { t: '20:15', n: '3. Hochrechnung', f: .71 }, { t: '21:00', n: '4. Hochrechnung', f: .92 }, { t: '22:30', n: 'Endergebnis', f: 1 }
];
function hochrechnung(E, step) {
  const f = HR_STEPS[step].f;
  if (step === 0) return { shares: E.prog, k: 0, counted: [] };
  const k = Math.round(f * E.order.length);
  const counted = E.order.slice(0, k);
  const C = E.cands.length;
  const sum = new Array(C).fill(0); let all = 0;
  counted.forEach(i => E.res.districts[i].v.forEach((x, c) => { sum[c] += x; all += x; }));
  const naive = sum.map(x => x / all * 100);
  if (f >= 1) return { shares: E.res.shares, k, counted };
  const w = Math.pow(f, .75);
  const mix = naive.map((x, c) => w * x + (1 - w) * E.prog[c]);
  const s = mix.reduce((a, b) => a + b, 0);
  return { shares: mix.map(x => x * 100 / s), k, counted, naive };
}

/* ---------- Bundestag & Umfragen (Bund) ---------- */
const CONC = { CDU: 1.0, CSU: 5.0, SPD: 1.0, AFD: 1.35, GRUENE: 1.0, FDP: .35, LINKE: 1.7, BSW: .5 };
function sainteLague(votes, seats) {
  const ps = Object.keys(votes); const res = {}; ps.forEach(p => res[p] = 0);
  for (let i = 0; i < seats; i++) { let best = null, bv = -1; for (const p of ps) { const q = votes[p] / (res[p] + .5); if (q > bv) { bv = q; best = p; } } res[best]++; }
  return res;
}
function bundSeats(S) {
  const v = {}; BUND_PARTIES.forEach(p => v[p] = S[p]);
  const d = {}; let ds = 0; BUND_PARTIES.forEach(p => { d[p] = Math.pow(v[p], 3) * CONC[p]; ds += d[p]; });
  const direct = {}; BUND_PARTIES.forEach(p => direct[p] = Math.round(299 * d[p] / ds));
  const elig = {}; BUND_PARTIES.forEach(p => { if (v[p] >= 5 || direct[p] >= 3) elig[p] = v[p]; });
  const seats = sainteLague(elig, 630);
  const fr = { UNION: (seats.CDU || 0) + (seats.CSU || 0) };
  ['SPD', 'AFD', 'GRUENE', 'FDP', 'LINKE', 'BSW'].forEach(p => fr[p] = seats[p] || 0);
  return { seats, fr, direct, out: BUND_PARTIES.filter(p => !(p in elig)) };
}
const HARD = [['AFD', '*'], ['UNION', 'LINKE'], ['FDP', 'LINKE'], ['BSW', 'GRUENE'], ['BSW', 'FDP']];
function coalitionsFor(fr) {
  const FR = ['UNION', 'SPD', 'AFD', 'GRUENE', 'FDP', 'LINKE', 'BSW'];
  const out = [];
  for (let m = 1; m < 128; m++) {
    const set = FR.filter((_, i) => m & (1 << i));
    if (set.some(f => !fr[f])) continue;
    let ok = true;
    for (const a of set) for (const b of set) { if (a >= b) continue; for (const [x, y] of HARD) if ((x === a && (y === b || y === '*')) || (x === b && (y === a || y === '*'))) ok = false; }
    if (!ok) continue;
    const seats = set.reduce((a, f) => a + fr[f], 0);
    if (seats < 316) continue;
    if (set.some(f => seats - fr[f] >= 316)) continue;
    out.push({ set, seats, chancellor: set.reduce((b, f) => fr[f] > fr[b] ? f : b, set[0]) });
  }
  return out.sort((a, b) => a.set.length - b.set.length || b.seats - a.seats);
}
function initBund() {
  const S = Object.assign({}, BUND0);
  G.bund = { S, Z: {}, E: {}, week: 0, hist: [], why: [] };
  Object.keys(S).forEach(p => { G.bund.Z[p] = 0; G.bund.E[p] = 0; });
  for (let i = 0; i < 26; i++) bundStep(true);

function bundStep(silent, shock) {
  const B = G.bund, keys = Object.keys(B.S);
  let sumZ = 0;
  keys.forEach(p => { B.Z[p] = .95 * B.Z[p] + .28 * Math.sqrt(BUND0[p] / 15) * gauss(); sumZ += B.Z[p]; });
  keys.forEach(p => { B.Z[p] -= sumZ / keys.length; });
  if (shock) Object.keys(shock).forEach(p => { B.E[p] = (B.E[p] || 0) + shock[p]; });
  let sumT = 0; const T = {};
  keys.forEach(p => { B.E[p] *= .94; const gov = ['CDU', 'CSU', 'SPD'].includes(p) ? -BUND0[p] * .02 : 0; T[p] = BUND0[p] + B.Z[p] + B.E[p] + gov; sumT += T[p]; });
  keys.forEach(p => { T[p] *= 100 / sumT; B.S[p] += .15 * (T[p] - B.S[p]); });

}

/* ---------- Deck-Aufbau (gewichtete Auswahl, Vielfalt, Partei- und Berufs-Affinität) ---------- */
const TOTAL_CARDS = 10;
const BG_TH = { lehrer: ['soz'], handwerk: ['wirt', 'wohn'], jurist: ['sich'], unternehmer: ['wirt'], pflege: ['soz'], landwirt: ['verk', 'klim'], polizei: ['sich'], journalist: ['med'] };
const PARTY_TH = { CDU: ['wirt', 'sich'], CSU: ['sich', 'verk'], SPD: ['soz'], AFD: ['sich'], GRUENE: ['klim', 'verk'], FDP: ['wirt'], LINKE: ['wohn', 'soz'], BSW: ['soz'], EIGEN: [] };
function cardWeight(id) {
  const c = CARDS[id]; let w = c.w;
  if (id === 'EV-017') w *= G.res.str > 50 ? 2.2 : .5;
  if (id === 'EV-005') w *= G.stats.ehr < 50 ? 1.4 : .8;
  if ((BG_TH[G.bg] || []).includes(c.th)) w *= 1.35;
  if ((PARTY_TH[G.party] || []).includes(c.th)) w *= 1.25;
  if (G.party === 'CSU' && id === 'EV-003') w *= 1.8;
  if (G.party === 'SPD' && id === 'EV-015') w *= 1.6;
  if (G.party === 'GRUENE' && ['EV-002', 'EV-001'].includes(id)) w *= 1.3;
  return w;
}
function buildDeck() {
  const pool = CARD_IDS.slice(), chosen = [];
  while (chosen.length < TOTAL_CARDS && pool.length) {
    const ws = pool.map(cardWeight), sum = ws.reduce((a, b) => a + b, 0);
    let x = rnd() * sum, i = 0; while (i < ws.length - 1 && (x -= ws[i]) > 0) i++;
    const id = pool.splice(i, 1)[0];
    // Vielfalt: höchstens ein absurdes Ereignis, nicht dreimal dasselbe Thema in Folge
    if (CARDS[id].kat === 'Absurdes' && chosen.some(c => CARDS[c].kat === 'Absurdes')) continue;
    chosen.push(id);
  }
  // Reihenfolge: gleiche Themen nicht direkt hintereinander; Krise früh-mittig
  for (let i = 1; i < chosen.length; i++) if (CARDS[chosen[i]].th === CARDS[chosen[i - 1]].th) { const j = chosen.findIndex((x, k) => k > i && CARDS[x].th !== CARDS[chosen[i - 1]].th); if (j > 0) [chosen[i], chosen[j]] = [chosen[j], chosen[i]]; }
  if (G.party === 'EIGEN') chosen[3] = 'EV-EG1';
  G.deck = chosen.map(id => ({ id, v: CARDS[id].vars() }));
  G.cardIdx = 0; G.queue = []; G.log = []; G.promises = []; G.pollHist = [expectedShares()];
}

/* ---------- Vorschau-Qualität (Berater:innen) ---------- */
const FXN = { b: 'Beliebt', p: 'Partei', d: 'Kasse', m: 'Medien', w: 'Wirtschaft', u: 'Umwelt', g: 'Gesellschaft' };
function advisorQ() { return clamp((G.stats.net + G.stats.iq) / 200, .15, .95); }
function optFx(card, v, o, out) {
  const fx = Object.assign({}, o.fx, o.fxf ? o.fxf(v) : {});
  const ok = o.chk ? (out === 'bad' ? o.chk.bad.fx : o.chk.ok.fx) : null;

}
function previewHTML(card, inst, o, oi) {

  const items = Object.keys(FXN).filter(k => fx[k]);

}
function chkProb(o) {

/* ---------- Entscheidung auflösen ---------- */
function applyMods(fx, o) {
  const f = Object.assign({}, fx), P = G.party;
  if (P === 'CDU') { if (f.w < 0) f.w = Math.round(f.w / 2); if (f.g < 0) f.g = Math.round(f.g / 2); if (o.fr === 'klima' && f.b > 0) f.b = Math.round(f.b / 2); }
  if (P === 'AFD' && f.m) f.m = Math.round(f.m * 1.5);
  if (P === 'FDP') { if (['sparen', 'wirtschaft'].includes(o.fr)) f.b = (f.b || 0) + 1; if (o.fr === 'sozial' && f.b > 0) f.b = Math.round(f.b * .7); if (o.donation && f.d) f.d = Math.round(f.d * 1.5); }
  if (P === 'SPD') { if (['sparen', 'deal'].includes(o.fr) && f.p < 0) f.p *= 2; if (['sparen', 'deal'].includes(o.fr) && !f.p) f.p = -1; }
  if (P === 'LINKE' && o.fr === 'sozial') f.b = (f.b || 0) + 1;
  if (P === 'GRUENE' && o.ideal) { f.p = (f.p || 0) + o.ideal * 2; f.b = (f.b || 0) - o.ideal; }
  if (P === 'EIGEN' && f.b > 0) f.b = Math.round(f.b * 1.25 * 10) / 10;
  return f;
}
ACT.choose = a => {
  const inst = G.deck[G.cardIdx], c = CARDS[inst.id], i = +a.dataset.i, o = c.opts[i];
  const before = Object.assign({}, G.res);
  let outcome = null, fx = Object.assign({}, o.fx, o.fxf ? o.fxf(inst.v) : {}), text = '';
  if (o.chk) {
    const p = chkProb(o), ok = rnd() < p; outcome = ok ? 'ok' : 'bad';
    const oc = ok ? o.chk.ok : o.chk.bad; fx = Object.assign(fx, oc.fx); text = oc.t;
    if (G.stats[o.chk.s] && ok) G.flags['won_' + o.chk.s] = 1;
  }
  fx = applyMods(fx, o);
  // Medienreaktion je Partei und Ausgangslage
  const risky = ['deal', 'populismus', 'angriff'].includes(o.fr) && rnd() < .5 || (o.fr === 'aussitzen' && rnd() < .35);
  const mr = mediaReaction(o.fr, G.party, risky);
  const mBonus = Math.round(mr.score * (G.party === 'AFD' ? 1.5 : 1) * (G.party === 'EIGEN' ? 1.2 : 1));
  fx.m = (fx.m || 0) + mBonus;
  const R = G.res;
  R.bel = clamp(R.bel + (fx.b || 0), 0, 100); R.par = clamp(R.par + (fx.p || 0), 0, 100);
  R.bud = Math.max(0, Math.round((R.bud + (fx.d || 0)) * 10) / 10);
  R.med = clamp(R.med + (fx.m || 0) * 2, -100, 100);
  R.wirt = clamp(R.wirt + (fx.w || 0), 0, 100); R.umw = clamp(R.umw + (fx.u || 0), 0, 100); R.ges = clamp(R.ges + (fx.g || 0), 0, 100);
  R.str = clamp(R.str + (fx.s || 0) + 1.5, 0, 100);
  if (o.pf) Object.keys(o.pf).forEach(k => G.prof[TH.indexOf(k)] = clamp(G.prof[TH.indexOf(k)] + o.pf[k], .1, 1));
  if (o.ml) Object.keys(o.ml).forEach(k => G.ml[k] = clamp((G.ml[k] || 0) + o.ml[k], -.4, .45));
  if (o.n) Object.keys(o.n).forEach(k => G.npc[k].v = clamp(G.npc[k].v + o.n[k], 0, 100));
  if (o.flag) G.flags[o.flag] = 1;
  if (o.promise) G.promises.push({ t: o.promise, card: c.title });
  if (G.party === 'GRUENE' && o.ideal) G.realo = clamp(G.realo + o.ideal * 12, -100, 100);
  if (G.party === 'EIGEN' && fx.m > 0) G.mom = Math.min(10, G.mom + 1);
  if (G.party === 'EIGEN' && fx.m < 0) G.mom = Math.max(0, G.mom - 1);
  if (mr.score > 0) G.recog = clamp(G.recog + .012 * mr.score, 0, .98);

  let queued = false;

  radii.forEach((rad, i) => { const n = Math.round(N * rad / sr); for (let k = 0; k < n; k++) { const ang = Math.PI - Math.PI * (n === 1 ? .5 : k / (n - 1)); seats.push({ a: ang, r: rad, x: 200 + rad * Math.cos(ang), y: 200 - rad * Math.sin(ang) }); } });

  const lab = o.labels === false ? '' : order.map(f => `<span class="chip" style="border-color:${frkColor(f)}">${esc(frkAbbr(f))} ${fr[f]}</span>`).join(' ');
  return `<svg viewBox="0 0 400 210" class="plenum" role="img" aria-label="Sitzverteilung im Plenarsaal">${dots.join('')}<text x="200" y="176" text-anchor="middle" fill="#eef1f8" font-size="15" font-weight="700">${N}</text><text x="200" y="192" text-anchor="middle" fill="#9ba7c6" font-size="10">Sitze · Mehrheit ab 316</text></svg>${lab ? `<div class="legend" style="margin-top:6px">${lab}</div>` : ''}`;
}
function lineChart(series, o) {

  const all = series.flatMap(s => s.data); let mn = Math.min(...all), mx = Math.max(...all); const pad = (mx - mn) * .12 + .5; mn = Math.max(0, mn - pad); mx += pad;

function playShot() {

  const t = $('#ctxt'); t.textContent = ''; let k = 0; const txt = sh.text || '';
  clearInterval(S.typing);

  S.typing = setInterval(() => { k += 2; t.textContent = txt.slice(0, k); if (k >= txt.length) { clearInterval(S.typing); S.typing = null; } }, 22);

ACT.cutnext = () => {
  const S = CUTSTATE; if (!S) return;
  if (S.typing) { clearInterval(S.typing); S.typing = null; $('#ctxt').textContent = S.full; return; }
  S.i++; if (S.i >= S.shots.length) endCut(); else playShot();
};

function endCut() {
  const S = CUTSTATE; if (!S) return; clearInterval(S.typing); CUTSTATE = null;

}

const SP_TIME = 8;
function ownFraktion() { return ['CDU', 'CSU'].includes(G.party) ? 'UNION' : G.party; }
function parliament() {
  // Demo-Legislatur: Ausgangslage, die Spielerpartei zieht mindestens mit ~7 % ein
  const S = {}; BUND_PARTIES.forEach(p => S[p] = BUND0[p]);
  if (G.party === 'EIGEN') { S.EIGEN = 7; const t = BUND_PARTIES.reduce((a, p) => a + S[p], 0) + 7; BUND_PARTIES.forEach(p => S[p] = S[p] * 93 / (t - 7)); }
  else if (S[G.party] < 7) { const add = 7 - S[G.party], others = BUND_PARTIES.filter(p => p !== G.party).reduce((a, p) => a + S[p], 0); BUND_PARTIES.forEach(p => { if (p !== G.party) S[p] -= add * S[p] / others; }); S[G.party] = 7; }
  const v = {}; Object.keys(S).forEach(p => { if (S[p] >= 5) v[p] = S[p]; });
  const seats = sainteLague(v, 630);
  const fr = { UNION: (seats.CDU || 0) + (seats.CSU || 0) };
  ['LINKE', 'SPD', 'GRUENE', 'FDP', 'BSW', 'AFD', 'EIGEN'].forEach(p => fr[p] = seats[p] || 0);
  Object.keys(fr).forEach(k => { if (!fr[k]) delete fr[k]; });
  return fr;
}
function frPos(f) {
  if (f === 'EIGEN') return [clamp((G.own.sl[0] - 50) / 50, -1, 1), clamp((G.own.sl[4] - G.own.sl[3]) / 60, -1, 1)];
  return FRK[f].pos;
}
function frName(f) { return f === 'EIGEN' ? G.own.abk || G.own.name : frkAbbr(f); }
const _frkColor = frkColor; frkColor = f => f === 'EIGEN' ? pcolor('EIGEN') : _frkColor(f);
const _frkAbbr = frkAbbr; frkAbbr = f => f === 'EIGEN' ? (G.own.abk || 'Eigene') : _frkAbbr(f);
if (FRAKTIONEN.indexOf('EIGEN') < 0) FRAKTIONEN.splice(3, 0, 'EIGEN');

function startSpeech() {
  ensureDemoGame();
  G.phase = 'speech';
  const fr = parliament(), own = ownFraktion();
  const others = Object.keys(fr).filter(f => f !== own).sort((a, b) => fr[b] - fr[a]);
  G.speech = { step: 'setup', fr, own, gegner: others[0], topic: null, tone: null, beat: 0, app: Object.fromEntries(Object.keys(fr).map(f => [f, 0])), time: 0, ordnung: 0, log: [], zw: 0 };
  save(); SCREENS.speech();
}
SCREENS.speech = () => {
  const S = G.speech; if (!S) return startSpeech();
  const head = `<div class="row sp"><div><div class="caps">Deutscher Bundestag</div><div class="small mut">${esc(G.name)} · ${esc(pname(G.party))}</div></div><div class="chip">${frName(S.own)} · ${S.fr[S.own]} Sitze</div></div>`;
  if (S.step === 'setup') {
    render(`${head}<h2>Deine erste Rede</h2><p class="mut small">Plenarsaal, 14:32 Uhr, Tagesordnungspunkt 5: „Aussprache“. Die Präsidentin ruft dich auf: Du hast ${SP_TIME} Minuten. Achte auf Beifall und Zwischenrufe der Fraktionen.</p>
      <div class="glass tight">${hemicycleSVG(S.fr, { hi: S.own, labels: true })}</div>
      <label class="f">Thema</label><div class="opts">${Object.entries(SPEECH).map(([k, t]) => `<button class="opt ${S.topic === k ? 'on' : ''}" data-act="spt" data-k="${k}">${t.e} ${t.n}</button>`).join('')}</div>
      <label class="f">Tonfall</label><div class="opts" style="flex-direction:column">${Object.entries(TONES).map(([k, t]) => `<button class="opt ${S.tone === k ? 'on' : ''}" style="text-align:left" data-act="spn" data-k="${k}"><b>${t.n}</b><br><span class="small mut" style="font-weight:400">${t.d}</span></button>`).join('')}</div>
      <button class="btn mt2" data-act="spstart" ${S.topic && S.tone ? '' : 'disabled'}>Ans Rednerpult</button>`);
  } else if (S.step === 'beat') {
    const T = SPEECH[S.topic], B = T.beats[S.beat];
    const used = S.time / SP_TIME * 100;
    render(`${head}
      <div class="row sp mt"><span class="small mut">Noch ${f1(Math.max(0, SP_TIME - S.time))} von ${SP_TIME} Min. Redezeit</span><span class="chip">${S.beat + 1}/${T.beats.length} · ${B.h}</span></div>
      <div class="bar mt" style="height:7px"><i style="width:${clamp(100 - used, 0, 100)}%;background:${used > 85 ? 'linear-gradient(90deg,#b34a4a,#ff7b7b)' : ''}"></i></div>
      <div class="glass tight mt" id="plen">${hemicycleSVG(S.fr, { labels: false, dr: 2.9 })}</div>
      <div id="appl" class="row wrap mt" style="gap:6px">${applauseHTML(S)}</div>
      <h3 class="mt">${esc(B.h)} – was sagst du?</h3>
      <div class="ochoices">${B.o.map((a, i) => `<button class="oc" data-act="sparg" data-i="${i}"><span class="tiny gold" style="text-transform:uppercase;letter-spacing:.1em">${({ fakt: 'Fakten', emo: 'Emotion', vision: 'Vision', humor: 'Humor', angriff: 'Angriff' })[a.tag]}</span><br>${esc(a.t.replace('{gegner}', frName(S.gegner)))}</button>`).join('')}</div>`);
  } else if (S.step === 'zw') {
    const z = S.zwCur;
    render(`${head}
      <div class="row sp mt"><span class="small mut">Noch ${f1(Math.max(0, SP_TIME - S.time))} von ${SP_TIME} Min. Redezeit</span><span class="chip">Zwischenruf!</span></div>
      <div class="bar mt" style="height:7px"><i style="width:${clamp(100 - S.time / SP_TIME * 100, 0, 100)}%"></i></div>
      <div class="glass tight mt">${hemicycleSVG(S.fr, { hi: z.f, labels: false, dr: 2.9 })}</div>
      <div class="zw"><div class="caps" style="color:#ff9b9b">Aus den Reihen der ${esc(frName(z.f))}</div><div class="serif" style="font-size:1.3rem;margin-top:4px">${esc(z.t)}</div>
        <div class="timer mt"><i id="zwtimer" style="transition:transform 4.5s linear"></i></div></div>
      <div class="ochoices">
        <button class="oc" data-act="zwr" data-r="kontern"><b>Schlagfertig kontern</b><div class="risk">Wagnis · ${Math.round(zwProb('kontern') * 100)} % (Charisma &amp; Medienwirkung)</div></button>
        <button class="oc" data-act="zwr" data-r="frage"><b>Zwischenfrage zulassen</b> <span class="tiny mut">(+1 Min.)</span><div class="risk">Wagnis · ${Math.round(zwProb('frage') * 100)} % (Intelligenz)</div></button>
        <button class="oc" data-act="zwr" data-r="ignorieren"><b>Ignorieren und weiterreden</b><div class="tiny mut">Kein Risiko, kein Gewinn.</div></button></div>`);
    requestAnimationFrame(() => requestAnimationFrame(() => { const t = $('#zwtimer'); if (t) { t.style.transform = 'scaleX(0)'; } }));
    clearTimeout(S.zt); S.zt = setTimeout(() => { if (G.speech && G.speech.step === 'zw') ACT.zwr({ dataset: { r: 'ignorieren', timeout: 1 } }); }, 4700);
  } else if (S.step === 'end') {
    speechEnd();
  }
};
function applauseHTML(S) {
  return Object.keys(S.fr).filter(f => S.fr[f] > 0).sort((a, b) => FRAKTIONEN.indexOf(a) - FRAKTIONEN.indexOf(b)).map(f => {
    const v = S.app[f], e = v > .6 ? '👏' : v > .1 ? '🙂' : v < -.6 ? '😠' : v < -.1 ? '😒' : '😐';
    return `<span class="chip" style="border-color:${frkColor(f)}">${esc(frkAbbr(f))} ${e}<span class="delta ${v >= 0 ? 'up' : 'dn'}">${v >= 0 ? '+' : '−'}${Math.abs(v).toFixed(1)}</span></span>`;
  }).join('');
}
ACT.spt = a => { G.speech.topic = a.dataset.k; SCREENS.speech(); };
ACT.spn = a => { G.speech.tone = a.dataset.k; SCREENS.speech(); };
ACT.spstart = () => { G.speech.step = 'beat'; SCREENS.speech(); };

function reception(f, arg, S) {
  const tone = TONES[S.tone], mult = tone.m[arg.tag];
  const fp = frPos(f), d = Math.hypot(arg.pos[0] - fp[0], arg.pos[1] - fp[1]);
  let r = (1 - d / 1.4);
  if (f === S.own) r += .35;
  if (arg.tag === 'humor') r = r * .5 + .35;
  if (arg.tag === 'angriff') {
    const gp = frPos(S.gegner), dg = Math.hypot(fp[0] - gp[0], fp[1] - gp[1]);
    if (f === S.gegner) r = -.9; else if (dg < 1) r = Math.min(r, -.25); else if (f === S.own) r = .7; else r = r * .4 + .1;
  }
  r = r * (r > 0 ? mult : 1 / Math.max(.6, mult)) + gauss() * .08;
  return clamp(r, -1.5, 1.5);
}
ACT.sparg = a => {
  const S = G.speech, T = SPEECH[S.topic], B = T.beats[S.beat], arg = B.o[+a.dataset.i];
  const cost = { fakt: 1.4, emo: 1.6, vision: 1.7, humor: 1.0, angriff: 1.2 }[arg.tag];
  S.time += cost;
  Object.keys(S.fr).forEach(f => { S.app[f] = clamp(S.app[f] + reception(f, arg, S) * 1.0, -3, 3); });
  S.log.push(arg.tag);
  // Ordnungsruf-Risiko bei Angriffen (Tonfall angriffslustig erhöht das Risiko)
  const risk = arg.tag === 'angriff' ? (S.tone === 'angr' ? .38 : .12) : 0;
  buzz(14);
  if (rnd() < risk) { S.ordnung++; S.app[S.own] -= .4; flashBanner('Ordnungsruf von der Präsidentin!'); buzz([40, 40, 40]); }
  S.lastArg = arg;
  // Zwischenruf der Fraktion mit der niedrigsten Stimmung (aber nie die eigene)
  const cand = Object.keys(S.fr).filter(f => f !== S.own).sort((x, y) => S.app[x] - S.app[y])[0];
  S.zwCur = { f: cand, t: pick(ZWISCHENRUFE[cand] || ['„Hört, hört!“']) };
  S.step = S.beat >= T.beats.length - 1 ? 'endzw' : 'zw';
  if (S.step === 'endzw') { S.step = 'end'; }
  S.beat++; save(); SCREENS.speech();
  if (S.step === 'end') return;
};
function zwProb(kind) {
  const s = G.stats, stress = Math.max(0, G.res.str - 60) * .4;
  if (kind === 'kontern') return clamp(.5 + (((s.cha + s.med) / 2) - 52 - stress) / 80, .12, .9);
  return clamp(.5 + (s.iq - 50 - stress) / 80, .12, .9);
}
ACT.zwr = a => {
  const S = G.speech; if (!S || S.step !== 'zw') return; clearTimeout(S.zt);
  const z = S.zwCur, r = a.dataset.r; let msg = '';
  if (r === 'kontern') {
    const ok = rnd() < zwProb('kontern');
    if (ok) { S.app[S.own] += .5; S.app[z.f] += .2; S.app = clampAll(S.app); msg = 'Kontra sitzt! Der Saal lacht – sogar ein bisschen bei den Zwischenrufern.'; S.time += .3; }
    else { S.app[S.own] -= .2; S.app[z.f] -= .3; if (rnd() < .3) { S.ordnung++; msg = 'Der Konter geht daneben – Ordnungsruf.'; buzz([40, 40, 40]); } else msg = 'Der Konter verpufft. Jemand hüstelt.'; S.time += .4; }
  } else if (r === 'frage') {
    S.time += 1; const ok = rnd() < zwProb('frage');
    Object.keys(S.app).forEach(f => S.app[f] += ok ? .25 : -.2); if (!ok) S.app[z.f] += .3; S.app = clampAll(S.app);
    msg = ok ? 'Du beantwortest die Frage präzise. Respekt aus mehreren Fraktionen.' : 'Bei der Frage zur Gegenfinanzierung verhedderst du dich. Der Zwischenrufer strahlt.';
  } else { S.app[z.f] -= a.dataset.timeout ? .2 : .1; msg = a.dataset.timeout ? 'Zu langsam – der Zwischenruf bleibt im Saal stehen.' : 'Du redest einfach weiter. Die Präsidentin nickt anerkennend.'; S.time += .1; }
  S.zwMsg = msg; S.step = S.beat >= SPEECH[S.topic].beats.length ? 'end' : 'beat'; save();
  if (S.step === 'beat') { SCREENS.speech(); flashBanner(msg); } else SCREENS.speech();
  if (S.step === 'end') G.speech.endMsg = msg;
};
function clampAll(o) { Object.keys(o).forEach(k => o[k] = clamp(o[k], -3, 3)); return o; }
function flashBanner(t) { const b = document.createElement('div'); b.className = 'banner'; b.textContent = t; $('#app').appendChild(b); setTimeout(() => b.remove(), 2600); }

function speechEnd() {
  const S = G.speech;
  if (!S.scored) {
    let wsum = 0, tot = 0; Object.keys(S.fr).forEach(f => { wsum += S.fr[f]; tot += S.fr[f] * S.app[f]; });
    const avg = tot / wsum / 3;           // −1 … +1
    const own = S.app[S.own] / 3;
    const over = Math.max(0, S.time - SP_TIME);
    let score = 50 + 34 * avg + 16 * own - 9 * S.ordnung - 6 * over;
    S.score = clamp(Math.round(score), 0, 100); S.scored = true;
    const dm = Math.round((S.score - 50) / 8), dp = Math.round((own) * 4 - S.ordnung * 2);
    G.res.med = clamp(G.res.med + dm * 2, -100, 100); G.res.par = clamp(G.res.par + dp, 0, 100);
    S.dm = dm; S.dp = dp; save();
  }
  const grade = S.score >= 80 ? ['Rede des Tages', 'Die Kameras bleiben auf dir, selbst der Bundestagspräsident klatscht.'] : S.score >= 60 ? ['Starker Auftritt', 'Gute Mischung aus Substanz und Schlagkraft. Die Fraktion ist zufrieden.'] : S.score >= 40 ? ['Solide', 'Ordentlich geredet – bloß das Protokoll wird mehr Aufmerksamkeit bekommen als du.'] : ['Verpufft', 'Die Rede war wie ein Dienstagnachmittag: da, aber nicht erinnerungswürdig.'];
  const rows = Object.keys(S.fr).sort((a, b) => FRAKTIONEN.indexOf(a) - FRAKTIONEN.indexOf(b)).map(f => `<div class="brow" style="grid-template-columns:96px 1fr 54px"><span class="nm small" style="font-weight:700"><span class="badge" style="width:12px;height:12px;border-radius:50%;--pc:${frkColor(f)}"></span>${esc(frkAbbr(f))}</span><div class="track"><div class="fill" style="width:${clamp((S.app[f] + 3) / 6 * 100, 2, 100)}%;--pc:${frkColor(f)}"></div></div><span class="val small">${S.app[f] >= 0 ? '+' : '−'}${Math.abs(S.app[f]).toFixed(1)}</span></div>`).join('');
  render(`<div class="caps">Deutscher Bundestag · Rede beendet</div><h2>${grade[0]}</h2>
    <div class="glass mt center"><div style="font:800 3rem var(--serif);color:var(--gold2)">${S.score}<span class="small mut"> / 100</span></div><p style="margin:.2em 0 0">${grade[1]}</p></div>
    <div class="glass mt"><div class="caps">Beifall &amp; Murren nach Fraktion</div>${rows}</div>
    <div class="row wrap mt" style="gap:6px"><span class="chip">Medienecho <span class="delta ${S.dm >= 0 ? 'up' : 'dn'}">${sgn(S.dm * 2)}</span></span><span class="chip">Fraktionsrückhalt <span class="delta ${S.dp >= 0 ? 'up' : 'dn'}">${sgn(S.dp)}</span></span><span class="chip">Ordnungsrufe ${S.ordnung}</span><span class="chip">Redezeit ${f1(Math.min(S.time, 9.9))} Min.</span></div>
    <div class="glass tight mt small"><b class="gold">Schlagzeile:</b> ${esc(speechHeadline(S))}</div>
    <div class="row mt2"><button class="btn ghost" data-act="speechagain">Nochmal versuchen</button><button class="btn" data-act="toend">Karriere-Bilanz</button></div>`, { nogear: true });
}
function speechHeadline(S) {
  const n = G.nn || G.name;
  if (S.ordnung >= 2) return `Ordnungsruf-Festival: ${n} poltert durch den Plenarsaal`;
  if (S.score >= 80) return `${n} begeistert das Hohe Haus – „So klingt Opposition, die regieren will“`;
  if (S.score >= 60) return `Starke Premiere: ${n} überzeugt mit Substanz und Schlagfertigkeit`;
  if (S.score >= 40) return `${n} hielt eine Rede. Sie war da.`;
  return `Verpufft im Plenum: ${n} bleibt blass`;
}
ACT.speechagain = () => startSpeech();
ACT.toend = () => { G.phase = 'end'; save(); show('end'); };

function legacyScore() {
  const r = G.result || { won: false, share: 30 }, R = G.res, S = G.speech;
  const parts = [
    ['Wahlergebnis', r.won ? 35 + Math.min(15, Math.max(0, (r.share - 50) * 1.5)) : r.share * .6, 50],
    ['Integrität', G.stats.ehr / 100 * 10 + (G.flags.spendeGeheim ? -2 : 0), 10],
    ['Medienecho', (R.med + 100) / 200 * 10, 10],
    ['Parteirückhalt', R.par / 100 * 10, 10],
    ['Versprechen', Math.min(10, G.promises.length * 2.5), 10],
    ['Rede im Bundestag', S && S.score ? S.score * .1 : 0, 10]
  ];
  const total = parts.reduce((a, p) => a + p[1], 0);
  return { parts, total: Math.round(total) };
}

ACT.restart = () => { G = null; wipeSave(); show('start'); };
