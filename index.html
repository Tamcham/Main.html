<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0a1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dog Packs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* =====================================================================
   DESIGN-SYSTEM  ·  Nachtblau mit Goldfolie & Rarity-Neon
   ===================================================================== */
:root{
  color-scheme:dark;
  --bg0:#07061a;--bg1:#110f2e;--bg2:#1b1746;--panel:rgba(255,255,255,.055);--panel2:rgba(255,255,255,.1);--panel-solid:#17153a;
  --line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.2);--txt:#f4f2ff;--dim:#a7a3cf;--acc:#7c5cff;--acc2:#38d9f5;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24;
  --gold:#ffd25e;--gold2:#f59e0b;--r-s:10px;--r-m:14px;--r-l:22px;--sh:0 12px 34px rgba(0,0,0,.45);--sh-s:0 4px 14px rgba(0,0,0,.35);
  --font-d:'Fredoka',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--font:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --sai-t:env(safe-area-inset-top,0px);--sai-b:env(safe-area-inset-bottom,0px);--sai-l:env(safe-area-inset-left,0px);--sai-r:env(safe-area-inset-right,0px);
  --nav-h:62px;--ease-spring:cubic-bezier(.2,1.3,.4,1);--ease-out:cubic-bezier(.2,.9,.3,1);
}
html{font-size:16px}
body{font-size:1rem}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--txt);font-family:var(--font);overscroll-behavior:none;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1100px 700px at 15% -10%,#2a1d6e66,transparent 60%),radial-gradient(900px 700px at 110% 110%,#0e5a7a44,transparent 60%),linear-gradient(170deg,var(--bg1),var(--bg0) 70%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{margin:0;font-family:var(--font-d);font-weight:600;letter-spacing:.01em;text-wrap:balance}
.hidden{display:none!important}
.dim{color:var(--dim)}
.row{display:flex;gap:12px;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.wrap{flex-wrap:wrap}.grid{display:grid;gap:16px}.grow{flex:1;min-width:0}.center{text-align:center}
.mono,.price{font-variant-numeric:tabular-nums}
svg.i{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.price svg.i,.val svg.i{color:var(--gold)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:var(--r-m);background:linear-gradient(180deg,#8f73ff,#6542ee);box-shadow:0 3px 0 #3b23a8,0 8px 18px rgba(80,50,220,.3);font-family:var(--font-d);font-weight:600;font-size:1rem;transition:transform .12s var(--ease-out),filter .15s,box-shadow .12s;white-space:nowrap;position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 50%);pointer-events:none}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(2px) scale(.98);box-shadow:0 1px 0 #3b23a8,0 3px 8px rgba(80,50,220,.3)}
.btn.sec{background:linear-gradient(180deg,#38356f,#2a2858);box-shadow:0 3px 0 #18163a}
.btn.gold{background:linear-gradient(180deg,#ffd86b,#f5a10b);color:#3a2300;box-shadow:0 3px 0 #a15c00,0 8px 18px rgba(245,158,11,.25)}
.btn.good{background:linear-gradient(180deg,#3ee0a4,#0c9c6e);box-shadow:0 3px 0 #04684a}
.btn.danger{background:linear-gradient(180deg,#ff8197,#e11d48);box-shadow:0 3px 0 #8f1233}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.88rem;border-radius:12px}
.btn.icon-only{padding:6px 10px}
.btn[disabled],.btn.off{filter:grayscale(.85) brightness(.65);pointer-events:none}
.icon-btn{width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--line);transition:background .15s,transform .12s;flex:none}
.icon-btn:hover{background:rgba(255,255,255,.18)}.icon-btn:active{transform:scale(.92)}
.icon-btn svg.i{width:20px;height:20px}
body[data-mode=mobile] .btn{min-height:48px}
body[data-mode=mobile] .btn.sm{min-height:42px}
body[data-mode=mobile] .icon-btn{width:46px;height:46px}

/* ---------- Flächen ---------- */
.glass{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-s)}
body[data-mode=desktop] .glass{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pad{padding:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:.82rem;font-weight:700}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s var(--ease-out)}
.bar.gold>i{background:linear-gradient(90deg,#f59e0b,#ffe27a)}
.bar.green>i{background:linear-gradient(90deg,#059669,#6ee7b7)}
kbd{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;font-size:.82em;background:var(--panel)}

/* =====================================================================
   APP-LAYOUT
   ===================================================================== */
#app{position:fixed;inset:0;display:grid;grid-template-columns:13rem 1fr;grid-template-rows:auto 1fr;padding:var(--sai-t) var(--sai-r) var(--sai-b) var(--sai-l)}
#hud{grid-column:1/-1;display:flex;gap:8px;align-items:center;padding:8px 14px;background:rgba(7,6,26,.75);border-bottom:1px solid var(--line);z-index:20}
body[data-mode=desktop] #hud{backdrop-filter:blur(12px)}
#hud .logo{font-family:var(--font-d);font-weight:700;font-size:1.3rem;display:flex;align-items:center;gap:8px;margin-right:auto;white-space:nowrap;color:#ffd86b}
#hud .logo span{background:linear-gradient(90deg,#ffd86b,#ff8ac0);-webkit-background-clip:text;background-clip:text;color:transparent}
.hud-item{display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line);min-height:38px;white-space:nowrap;font-family:var(--font-d);font-weight:600}
.hud-item b{font-variant-numeric:tabular-nums;font-weight:600;display:flex;align-items:center;gap:3px}
#hudCoins svg{color:var(--gold)}#hudCoins b{color:var(--gold)}
#hudLuck svg{color:#5eead4}#hudXp svg{color:#fbbf24}#hudAlb svg{color:#a5b4fc}#hudEmerg{color:var(--warn);cursor:pointer}
#hudLuck .lk{position:relative;width:54px;height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
#hudLuck .lk i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#22d3ee,#a855f7,#ffd24a);width:0;transition:width .6s}
#hudLuck.pulse{animation:pulse .8s}
@keyframes pulse{40%{transform:scale(1.12);box-shadow:0 0 22px #a855f7}}
#hudXp .xb{width:56px;height:6px}
#nav{display:flex;flex-direction:column;gap:4px;padding:12px;overflow:auto;border-right:1px solid var(--line);background:rgba(7,6,26,.35)}
#nav button{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r-m);text-align:left;color:var(--dim);transition:background .15s,color .15s;position:relative;font-family:var(--font-d);font-weight:600}
#nav button:hover{background:var(--panel2);color:var(--txt)}
#nav button.active{background:linear-gradient(90deg,rgba(124,92,255,.42),rgba(56,217,245,.14));color:#fff;box-shadow:inset 0 0 0 1px var(--line)}
#nav button .ico{width:1.6rem;display:flex;justify-content:center;flex:none}
#nav button .ico svg{width:22px;height:22px}
#nav button .kbd{margin-left:auto;font-size:.7rem;opacity:.45;border:1px solid var(--line);border-radius:5px;padding:0 5px}
#nav button.city{background:linear-gradient(90deg,#f59e0b,#ef4444);color:#fff;margin-top:6px}
#nav .badge{position:absolute;right:10px;top:7px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
#view{overflow:auto;padding:18px;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#view:focus,#view:focus-visible{outline:none}
#view>section{max-width:80rem;margin:0 auto;animation:viewIn .38s var(--ease-out)}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}}
.view-title{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.view-title h2{font-size:1.65rem;display:flex;align-items:center;gap:10px}
.view-title h2 svg{color:var(--gold)}

/* ---------- Mobile-Layout ---------- */
body[data-mode=mobile] #app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
body[data-mode=mobile] #hud{padding:6px 10px;gap:5px;flex-wrap:nowrap;overflow:hidden}
body[data-mode=mobile] #hud .logo{display:none}
body[data-mode=mobile] .hud-item{padding:3px 8px;gap:4px;font-size:.8rem;min-height:32px;flex:0 1 auto}
body[data-mode=mobile] .hud-item svg.i{width:15px;height:15px}
body[data-mode=mobile] #hudXp .xb,body[data-mode=mobile] #hudLuck .lk{display:none}
body[data-mode=mobile] #hud .icon-btn{width:34px;height:34px;margin-left:auto}
body[data-mode=mobile] #hudEmerg{position:absolute;top:calc(48px + var(--sai-t));right:8px;z-index:30;background:rgba(40,28,0,.94)}
body[data-mode=mobile] #nav{flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:4px 6px;gap:2px;background:rgba(9,8,28,.97);order:3;overflow:hidden}
body[data-mode=mobile] #nav button{flex-direction:column;gap:3px;padding:6px 2px;font-size:.66rem;flex:1;min-width:0;min-height:var(--nav-h);justify-content:center;align-items:center;text-align:center;border-radius:14px;background:none;box-shadow:none}
body[data-mode=mobile] #nav button .ico{width:auto;transition:transform .25s var(--ease-spring)}
body[data-mode=mobile] #nav button.active{color:#fff}
body[data-mode=mobile] #nav button.active .ico{transform:translateY(-2px) scale(1.12);color:var(--gold)}
body[data-mode=mobile] #nav button.active::before{content:"";position:absolute;top:2px;left:50%;width:22px;height:3px;margin-left:-11px;border-radius:3px;background:var(--gold)}
body[data-mode=mobile] #nav button.city{margin:2px 0;background:linear-gradient(160deg,#f59e0b,#ef4444);color:#fff}
body[data-mode=mobile] #nav button .kbd{display:none}
body[data-mode=mobile] #nav .badge{right:calc(50% - 22px);top:4px}
body[data-mode=mobile] #view{padding:12px}
body[data-mode=mobile] .view-title h2{font-size:1.32rem}
@media (max-height:520px){
  body[data-mode=mobile] #app{grid-template-columns:calc(74px + var(--sai-l)) 1fr;grid-template-rows:auto 1fr;padding-left:0}
  body[data-mode=mobile] #nav{order:0;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding:4px 4px 4px calc(4px + var(--sai-l));overflow-y:auto;overflow-x:hidden}
  body[data-mode=mobile] #nav button{flex:none;min-height:52px;width:100%}
  body[data-mode=mobile] #nav button.active::before{display:none}
  body[data-mode=mobile] #view{padding:8px 12px}
  .modal{max-height:100%}
}

/* =====================================================================
   PACK-SHOP & PACK-GRAFIK
   ===================================================================== */
.hero-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}
body[data-mode=mobile] .hero-row{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 -12px 14px;padding:0 12px 4px;scrollbar-width:none}
body[data-mode=mobile] .hero-row::-webkit-scrollbar{display:none}
body[data-mode=mobile] .hero-row>*{flex:0 0 84%;scroll-snap-align:start}
.dotd{display:flex;gap:14px;align-items:center;padding:14px}
.hero-row .glass b svg{color:var(--gold)}
.big-ic{width:96px;display:flex;justify-content:center;color:#ffd86b}.big-ic svg{width:64px;height:64px}
.pack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr));gap:16px}
body[data-mode=mobile] .pack-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pack-tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 14px 14px;border-radius:var(--r-l);background:radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--pc) 26%,transparent),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line);overflow:hidden}
.pack-tile.locked-p .pack-art{filter:saturate(.55) brightness(.8)}
.pack-art{display:block;perspective:800px;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s var(--ease-out);touch-action:manipulation}
.pack-art .pk{animation:pkFloat 4.5s ease-in-out infinite}
.pack-tile:nth-child(2n) .pack-art .pk{animation-delay:-1.5s}.pack-tile:nth-child(3n) .pack-art .pk{animation-delay:-3s}
@keyframes pkFloat{50%{transform:translateY(-6px) rotate(.6deg)}}
.pack-art:active{transform:scale(.96)}
.pt-info{width:100%;display:flex;flex-direction:column;gap:7px;align-items:center;text-align:center}
.pt-info h3{font-size:1.05rem}
.pt-price{display:flex;gap:8px;align-items:baseline}
.price{font-family:var(--font-d);font-weight:600;color:var(--gold);font-size:1.15rem;display:inline-flex;align-items:center;gap:5px}
.pack-meta{font-size:.78rem;color:var(--dim);min-height:2.3em;font-weight:600}
.pity{width:100%}.pity small{display:flex;justify-content:space-between;color:var(--dim);font-size:.7rem;margin-bottom:3px;font-weight:700}
.pack-tile .btns{display:flex;gap:8px;width:100%}
.sale-tag{position:absolute;top:12px;right:-32px;background:var(--bad);padding:3px 36px;transform:rotate(35deg);font-size:.72rem;font-weight:800;z-index:3}
body[data-mode=mobile] .pack-tile{padding:12px 8px 10px;gap:8px}
body[data-mode=mobile] .pack-meta{display:none}
body[data-mode=mobile] .pt-info h3{font-size:.92rem}
body[data-mode=mobile] .price{font-size:1rem}
/* Die Folienverpackung */
.pk{--pw:8.6rem;position:relative;width:var(--pw);aspect-ratio:5/7.4;font-size:calc(var(--pw)/9)}
.pk.big{--pw:min(250px,60vw,40vh)}
.pk-body{position:absolute;inset:0;border-radius:.55em;overflow:hidden;background:linear-gradient(155deg,var(--pl) 0%,var(--pc) 34%,var(--pd) 100%);box-shadow:0 1.2em 2em -.6em rgba(0,0,0,.7),inset 0 0 0 .1em rgba(255,255,255,.28),inset .5em 0 1.2em -.6em rgba(255,255,255,.35),inset -.6em 0 1.4em -.6em rgba(0,0,0,.5)}
.pk-foil{position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 .25em,transparent .25em .9em),radial-gradient(70% 40% at 50% 45%,rgba(255,255,255,.28),transparent 70%)}
.pk-rays{position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.08) 0 6deg,transparent 6deg 18deg);opacity:.7}
.pk-crimp{position:absolute;left:0;right:0;height:1.35em;z-index:2;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.2)),repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 .18em,transparent .18em .45em),var(--pc)}
.pk-crimp.t{top:0;border-radius:.55em .55em 0 0;-webkit-mask:conic-gradient(from 135deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50% / .6em 100%;mask:conic-gradient(from 135deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50% / .6em 100%;transform-origin:100% 100%}
.pk-crimp.b{bottom:0;border-radius:0 0 .55em .55em;-webkit-mask:conic-gradient(from -45deg at top,#0000,#000 1deg 89deg,#0000 90deg) 50% / .6em 100%;mask:conic-gradient(from -45deg at top,#0000,#000 1deg 89deg,#0000 90deg) 50% / .6em 100%}
.pk-brand{position:absolute;top:1.65em;left:0;right:0;text-align:center;font:700 .62em var(--font-d);letter-spacing:.32em;color:rgba(255,255,255,.85);text-shadow:0 .1em .3em rgba(0,0,0,.4)}
.pk-emblem{position:absolute;left:50%;top:30%;width:4.2em;height:4.2em;transform:translate(-50%,-10%);filter:drop-shadow(0 .25em .35em rgba(0,0,0,.45))}
.pk-emblem svg{width:100%;height:100%}
.pk-name{position:absolute;left:.4em;right:.4em;top:64%;text-align:center;font:700 1.05em/1.05 var(--font-d);text-transform:uppercase;letter-spacing:.04em;color:#fff;text-shadow:0 .1em .3em rgba(0,0,0,.55)}
.pk-count{position:absolute;left:0;right:0;top:77%;text-align:center;font:600 .6em var(--font-d);color:rgba(255,255,255,.8);letter-spacing:.12em;text-transform:uppercase}
.pk-gems{position:absolute;left:0;right:0;bottom:1.9em;display:flex;justify-content:center;gap:.22em}
.pk-gems i{width:.42em;height:.42em;transform:rotate(45deg);background:#fff;box-shadow:0 0 .4em #fff;opacity:.9}
.pk-shine{position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 58%);transform:translateX(-130%);animation:shine 5s infinite;mix-blend-mode:soft-light}
@keyframes shine{38%,100%{transform:translateX(130%)}}
.pk-t7 .pk-body{background:conic-gradient(from 200deg at 60% 40%,#1b1236,#3c2a6e,#0b0820,#1b1236)}
.pk-t7 .pk-rays{background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.12) 0 3deg,transparent 3deg 12deg)}

/* =====================================================================
   KARTE (renderCard)
   ===================================================================== */
.card{--cw:150px;--c1:#8c97a8;--c2:#dfe5ee;--c3:#5f6878;--glow:#8c97a822;position:relative;width:var(--cw);aspect-ratio:5/7;font-size:calc(var(--cw)/16);perspective:1100px;flex:none;cursor:pointer;-webkit-touch-callout:none}
.card.sz-mini{--cw:50px}.card.sz-xs{--cw:96px}.card.sz-sm{--cw:132px}.card.sz-md{--cw:176px}.card.sz-lg{--cw:min(300px,72vw)}.card.sz-xl{--cw:min(330px,76vw,calc(52vh * .714))}
.card .rot{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .3s var(--ease-out)}
.card.tilting .rot{transition:transform .07s linear}
.card .flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s var(--ease-spring)}
.card.flipped .flip{transform:rotateY(180deg)}
.card .face{position:absolute;inset:0;border-radius:.95em;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:#0c0b22}
.card .front{box-shadow:0 .35em 1.1em rgba(0,0,0,.55),0 0 1.3em var(--glow)}
.card .frame{position:absolute;inset:0;border-radius:.95em;padding:.36em;background:linear-gradient(145deg,var(--c2) 0%,var(--c1) 28%,var(--c3) 55%,var(--c1) 78%,var(--c2) 100%)}
.card .frame::before{content:"";position:absolute;inset:.36em;border-radius:.64em;box-shadow:inset 0 0 0 .08em rgba(255,255,255,.45),inset 0 0 0 .2em rgba(0,0,0,.35),inset 0 0 1.2em rgba(0,0,0,.6);pointer-events:none;z-index:6}
.card .frame::after{content:"";position:absolute;inset:0;border-radius:.95em;pointer-events:none;z-index:7;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 14%,rgba(255,255,255,0) 86%,rgba(0,0,0,.22));mix-blend-mode:soft-light}
.card.t4 .frame::after,.card.t5 .frame::after,.card.t6 .frame::after,.card.t7 .frame::after,.card.t8 .frame::after,.card.t9 .frame::after,.card.t10 .frame::after,.card.t11 .frame::after,.card.t12 .frame::after{background:repeating-linear-gradient(115deg,rgba(255,255,255,.1) 0 .12em,transparent .12em .6em),linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 14%,rgba(255,255,255,0) 86%,rgba(0,0,0,.22))}
.card .frame>.inner{position:relative;width:100%;height:100%;border-radius:.64em;overflow:hidden;background:radial-gradient(120% 60% at 50% 0,hsl(var(--h) 45% 26%),transparent 70%),linear-gradient(180deg,hsl(var(--h) 32% 18%),hsl(var(--h) 38% 8%) 70%);display:flex;flex-direction:column}

/* Rückseite: Werte bzw. Pack-Cover */
.card .back{transform:rotateY(180deg)}

.card.down .back .frame{display:none}

/* gesperrt / Silhouette */
.card.locked .bs{display:none!important}

.card.locked .frame{background:linear-gradient(145deg,#4a4c70,#2c2e4c)!important;animation:none!important}

.card.locked .gems svg{fill:#5d6088;filter:none}

.card.live .fx-holo,.card.hov:hover .fx-holo{animation:holo 6s linear infinite}
@keyframes holo{50%{background-position:100% 100%}}

.card.live .fx-spark{animation:twinkle 1.8s infinite alternate}
@keyframes twinkle{0%{opacity:.25}100%{opacity:1}}
.card.t8 .fx-gal,.card.t9 .fx-gal,.card.t10 .fx-gal,.card.t11 .fx-gal,.card.t12 .fx-gal{opacity:.5;mix-blend-mode:screen;background:radial-gradient(ellipse at 30% 20%,#7c3aed99,transparent 55%),radial-gradient(ellipse at 75% 70%,#06b6d499,transparent 55%)}
.card.t10 .frame,.card.t11 .frame,.card.t12 .frame{background:conic-gradient(from var(--ang,0deg),#ff3d71,#ffd24a,#4ade80,#22d3ee,#6366f1,#e879f9,#ff3d71)}

@keyframes glowp{from{box-shadow:0 .35em 1.1em rgba(0,0,0,.55),0 0 .8em var(--glow)}to{box-shadow:0 .35em 1.1em rgba(0,0,0,.55),0 0 2.6em var(--c1)}}
.card.t12 .frame>.inner{background:radial-gradient(circle at 50% 40%,#22053a,#000 80%)}

.card.hov{transition:transform .2s var(--ease-out)}

.tc1{color:#b3bccb}.tc2{color:#4ade80}.tc3{color:#38bdf8}.tc4{color:#c084fc}.tc5{color:#fbbf24}.tc6{color:#fb3b5f}.tc7{color:#fff1b8}.tc8{color:#8b98ff}.tc9{color:#9be3ff}.tc10{color:#f08cff}.tc11{color:#ff8a2a}.tc12{color:#fff}
/* Special Editions */
.card .edbadge{position:absolute;z-index:3;left:50%;top:.4em;transform:translateX(-50%);display:flex;align-items:center;gap:.25em;font:700 .66em var(--font-d);letter-spacing:.1em;text-transform:uppercase;padding:.15em .75em;border-radius:99px;background:#0b0a1fd0;color:#fff;border:.08em solid var(--ec,#fff);white-space:nowrap;box-shadow:0 0 .8em var(--ec)}

/* =====================================================================
   OVERLAYS / MODALE / TOASTS
   ===================================================================== */
#overlays{position:fixed;inset:0;z-index:100;pointer-events:none}
.ov{position:absolute;inset:0;pointer-events:auto;display:flex;align-items:center;justify-content:center;padding:calc(12px + var(--sai-t)) calc(12px + var(--sai-r)) calc(12px + var(--sai-b)) calc(12px + var(--sai-l));background:rgba(5,4,18,.72);animation:fade .2s}
body[data-mode=desktop] .ov{backdrop-filter:blur(6px)}
@keyframes fade{from{opacity:0}}
.modal{position:relative;width:min(560px,100%);max-height:100%;overflow:auto;padding:20px;background:linear-gradient(170deg,#1d1a4c,#100e2e);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh);animation:modalIn .3s var(--ease-spring)}
.modal.wide{width:min(980px,100%)}
@keyframes modalIn{from{transform:scale(.92) translateY(14px);opacity:0}}
.modal h3{font-size:1.3rem;margin-bottom:10px;padding-right:44px;display:flex;gap:8px;align-items:center}
.modal .x{position:absolute;top:10px;right:10px;z-index:3}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
body[data-mode=mobile] .ov{align-items:flex-end;padding:0}
body[data-mode=mobile] .modal{width:100%;max-height:calc(100% - 24px - var(--sai-t));border-radius:24px 24px 0 0;padding:22px 16px calc(16px + var(--sai-b));animation:sheetIn .34s var(--ease-out)}
body[data-mode=mobile] .modal .actions .btn{flex:1}
@keyframes sheetIn{from{transform:translateY(100%)}}
#toasts{position:fixed;left:50%;top:calc(64px + var(--sai-t));transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:14px;background:rgba(22,20,58,.96);border:1px solid var(--line);box-shadow:var(--sh);animation:toastIn .4s var(--ease-spring),toastOut .4s 3.2s forwards;font-size:.92rem;font-weight:700;text-align:left}
.toast.good{border-color:var(--ok)}.toast.bad{border-color:var(--bad)}.toast.gold{border-color:var(--gold);box-shadow:0 0 24px #ffd24a44}.toast.gold svg.i{color:var(--gold)}
@keyframes toastIn{from{transform:translateY(-20px) scale(.92);opacity:0}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px)}}
#loading{position:fixed;inset:0;z-index:500;background:radial-gradient(circle at 50% 40%,#2a1d6e,#07061a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s}
#loading .big{width:96px;height:96px;color:#ffd86b;animation:bob 1.2s infinite alternate ease-in-out}
#loading .big svg{width:100%;height:100%}
@keyframes bob{to{transform:translateY(-12px) rotate(6deg)}}
#loading .ttl{font-family:var(--font-d);font-size:2.2rem;font-weight:700;background:linear-gradient(90deg,#ffd86b,#ff8ac0);-webkit-background-clip:text;background-clip:text;color:transparent}
#loading .tip{color:var(--dim);max-width:80vw;text-align:center;min-height:2.6em;font-weight:600}
#loading .bar{width:min(300px,70vw)}
.odds-table{width:100%;border-collapse:collapse;font-size:.9rem}
.odds-table td,.odds-table th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.odds-table td.r,.odds-table th.r{text-align:right;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}

/* =====================================================================
   PACK-OPENING
   ===================================================================== */
#packOv{position:absolute;inset:0;pointer-events:auto;overflow:hidden;touch-action:none;background:#07061a}
#packOv .po-bg{position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 42%,color-mix(in srgb,var(--pc) 32%,#1b1446),#07061a 75%)}
#packOv .po-bg::after{content:"";position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg at 50% 45%,rgba(255,255,255,.035) 0 6deg,transparent 6deg 16deg);animation:spin 60s linear infinite}
#fxCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}
#packStage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:10;padding:calc(56px + var(--sai-t)) 12px calc(96px + var(--sai-b))}
.po-pack{position:relative;transform:translateX(var(--jx,0)) rotate(var(--jr,0deg));touch-action:none;cursor:grab;transition:filter .2s}
.po-pack.held{cursor:grabbing;filter:brightness(1.08)}
.po-pack .pk{animation:pkIn .7s var(--ease-spring),pkFloat 4s .7s ease-in-out infinite}
@keyframes pkIn{from{transform:translateY(40vh) scale(.6) rotate(-8deg);opacity:0}}
.po-pack .pk-lay.strip{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;transition:transform .05s linear;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.po-pack .pk-lay.strip .pk{animation:pkIn .7s var(--ease-spring),pkFloat 4s .7s ease-in-out infinite}
.po-pack .pk-inside{position:absolute;inset:0;pointer-events:none;background:radial-gradient(70% 140% at 50% 120%,var(--tease),#150f33 60%,#090620);border-radius:14px}
.po-pack .pk-inside::after{content:"";position:absolute;inset:0;background:linear-gradient(#fff,#fff) 10% 82%/80% 2px no-repeat,linear-gradient(#e7e7ff,#e7e7ff) 14% 92%/72% 2px no-repeat,linear-gradient(#fff5,#fff0) 0 0/100% 100%}
.po-pack .rip-edge{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#fff,#dfe8ff);filter:drop-shadow(0 0 5px var(--tease))}
.po-pack .tear-light{position:absolute;left:0;right:0;top:4%;height:20%;background:radial-gradient(60% 60% at 50% 60%,var(--tease),transparent 70%);opacity:calc(var(--tear,0) * .9);filter:blur(8px);pointer-events:none;mix-blend-mode:screen}
.po-pack .tear-line{position:absolute;left:0;right:0;top:16%;height:0;border-top:2px dashed rgba(255,255,255,.7);z-index:5;pointer-events:none;clip-path:inset(-4px 0 -4px calc(var(--tear,0) * 100%))}
.po-pack .tear-grip{position:absolute;top:1%;left:8%;width:40px;height:40px;color:#fff;opacity:calc(1 - var(--tear,0) * 4);filter:drop-shadow(0 2px 6px #000);animation:grip 1.8s ease-in-out infinite;pointer-events:none;z-index:6}
.po-pack .tear-grip svg{width:100%;height:100%}
@keyframes grip{0%{transform:translateX(0)}60%{transform:translateX(min(150px,34vw))}100%{transform:translateX(min(150px,34vw));opacity:0}}
.po-pack.torn .pk-lay.strip{transition:transform .7s cubic-bezier(.4,0,.9,.5),opacity .6s;transform:translate(70%,-260%) rotate(80deg)!important;opacity:0}
.po-pack.torn .rip-edge,.po-pack.torn .tear-line{opacity:0;transition:opacity .3s}
.po-pack.drop{transition:transform .75s cubic-bezier(.6,0,.9,.5),opacity .6s .15s;transform:translateY(75vh) scale(.82) rotate(5deg);opacity:0}
.po-stack{position:relative;width:min(330px,74vw,calc(50vh * .714));aspect-ratio:5/7;flex:none}
.po-card{position:absolute!important;inset:0;--cw:min(330px,74vw,calc(50vh * .714))!important;touch-action:none;will-change:transform}
.po-card.top{cursor:grab}
.po-card.grab{cursor:grabbing}
.po-card.grab .front{box-shadow:0 2em 3em -1em rgba(0,0,0,.75),0 0 1.6em var(--glow)}
#cardCap{min-height:3.6em;text-align:center;position:relative;z-index:12;opacity:0;transform:translateY(8px)}
#cardCap.in{animation:capIn .45s var(--ease-spring) forwards}
@keyframes capIn{to{opacity:1;transform:none}}
#cardCap .cap-nm{font:700 1.35rem var(--font-d)}
#cardCap .cap-sub{color:var(--dim);font-weight:700;display:flex;gap:6px;justify-content:center;align-items:center}
#cardCap .cap-ed{font:700 .9rem var(--font-d);letter-spacing:.08em;text-transform:uppercase;display:flex;gap:6px;justify-content:center;align-items:center}
.po-tray{position:absolute;left:0;right:0;bottom:calc(12px + var(--sai-b));display:flex;justify-content:center;gap:6px;z-index:20;padding:0 10px;flex-wrap:wrap}
.po-tray .card{animation:trayIn .45s var(--ease-spring)}
@keyframes trayIn{from{transform:translateY(-70px) scale(1.8) rotate(-12deg);opacity:0}}
.po-hint{position:absolute;left:0;right:0;bottom:calc(84px + var(--sai-b));text-align:center;color:#d8d4ff;font-weight:700;font-size:.95rem;z-index:20;pointer-events:none;display:flex;gap:8px;justify-content:center;align-items:center;padding:0 16px;animation:hint 1.8s ease-in-out infinite alternate}
@keyframes hint{to{opacity:.55}}
.po-top{position:absolute;top:calc(10px + var(--sai-t));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:30}
.po-actions{position:absolute;top:calc(60px + var(--sai-t));left:0;right:0;display:flex;justify-content:center;z-index:30}
.po-new{position:absolute;top:calc(64px + var(--sai-t));left:50%;transform:translateX(-50%);z-index:45;font:700 1.35rem var(--font-d);letter-spacing:.06em;color:#ffe27a;text-shadow:0 0 18px #ff7a45;display:flex;gap:8px;align-items:center;white-space:nowrap;animation:newIn 1.7s var(--ease-out) forwards;pointer-events:none}
@keyframes newIn{0%{opacity:0;transform:translateX(-50%) scale(.4)}15%{opacity:1;transform:translateX(-50%) scale(1.12)}25%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-14px)}}
.shock{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:3px solid var(--c);box-shadow:0 0 20px var(--c),inset 0 0 20px var(--c);z-index:39;pointer-events:none;animation:shock .85s var(--ease-out) forwards}
@keyframes shock{from{transform:scale(.3);opacity:1}to{transform:scale(calc(9 * var(--s,1)));opacity:0}}
#packOv.cut-on .po-top,#packOv.cut-on .po-actions,#packOv.cut-on .po-hint,#packOv.cut-on .po-tray{opacity:0;pointer-events:none}
#packOv.cut-hide .po-stack,#packOv.cut-hide #cardCap{opacity:0;transition:opacity .4s}
#cutCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}
#cutLayer{position:absolute;inset:0;z-index:55;pointer-events:none;display:flex;align-items:center;justify-content:center;flex-direction:column}
#cutLayer.on{pointer-events:auto}
#cutTitle{font-family:var(--font-d);font-size:clamp(2rem,9vw,5.5rem);font-weight:700;letter-spacing:.14em;text-align:center;text-transform:uppercase;text-shadow:0 0 30px currentColor,0 6px 20px #000;display:flex;flex-wrap:wrap;justify-content:center;padding:0 10px}
#cutTitle span{display:inline-block;opacity:0;transform:translateY(40px) scale(.4);filter:blur(10px);animation:letter .7s forwards}
@keyframes letter{to{opacity:1;transform:none;filter:none}}
#cutSub{font-size:clamp(1rem,3.4vw,1.8rem);color:#fff;opacity:0;letter-spacing:.3em;margin-top:10px;text-transform:uppercase;text-align:center;padding:0 10px;transition:opacity 1s;font-weight:700}
#cutSub.on{opacity:.9}
#cutSkip{position:absolute;right:calc(16px + var(--sai-r));bottom:calc(16px + var(--sai-b));z-index:70;opacity:0;pointer-events:none;transition:opacity .4s}
#cutSkip.on{opacity:1;pointer-events:auto}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:65}
.shake{animation:shk .5s}
@keyframes shk{10%{transform:translate(-8px,4px)}30%{transform:translate(9px,-5px)}50%{transform:translate(-6px,-6px)}70%{transform:translate(6px,6px)}90%{transform:translate(-3px,2px)}}
body.reduce-fx .shake{animation:none}
.vignette{position:absolute;inset:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.85));opacity:0;transition:opacity .8s}
.vignette.on{opacity:1}
/* Zusammenfassung */
#packOv .summary{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:70;width:min(980px,94vw);max-height:calc(100% - 40px);overflow:auto;padding:20px;border-radius:24px;background:linear-gradient(170deg,#1d1a4cf2,#100e2ef5);border:1px solid var(--line);box-shadow:var(--sh);animation:sumIn .5s var(--ease-spring)}
@keyframes sumIn{from{opacity:0;transform:translate(-50%,-44%) scale(.94)}}
.sum-hd{display:flex;gap:14px;align-items:center}
.sum-pk .pk{--pw:3.4rem}
.sum-pk .pk-brand,.sum-pk .pk-count,.sum-pk .pk-gems{display:none}
.sum-hd h2{font-size:1.4rem}
.sum-cards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:16px 0}
.sum-cards .card{animation:cardPop .5s var(--ease-spring) backwards}
@keyframes cardPop{from{transform:translateY(30px) scale(.7);opacity:0}}
.sum-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:10px}
.sum-kpis .kpi{padding:9px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.sum-kpis small{display:block;color:var(--dim);font-size:.72rem;font-weight:700}.sum-kpis b{font-family:var(--font-d);font-weight:600;display:flex;gap:4px;align-items:center;font-size:1.05rem}
.note{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--c,var(--gold));margin-bottom:8px;font-weight:700;font-size:.9rem}
.note svg.i{color:var(--c,var(--gold))}
.sum-acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
body[data-mode=mobile] #packOv .summary{width:100%;left:0;right:0;top:auto;bottom:0;transform:none;border-radius:24px 24px 0 0;max-height:calc(100% - 50px - var(--sai-t));padding:16px 14px calc(16px + var(--sai-b));animation:sheetIn .4s var(--ease-out)}
body[data-mode=mobile] .sum-acts .btn{flex:1 1 40%}
body[data-mode=mobile] .sum-cards{gap:8px}

/* =====================================================================
   ALBUM & DUPLIKATE
   ===================================================================== */
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--dim);font-weight:600;font-family:var(--font-d);transition:background .2s,color .2s;white-space:nowrap}
.tabs button.active{background:var(--acc);color:#fff;border-color:transparent}

.album-wrap{display:grid;grid-template-columns:19rem 1fr;gap:16px;align-items:start}

.filters{padding:14px;display:flex;flex-direction:column;gap:10px}

.inp{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-height:44px;width:100%;color:var(--txt)}

.book{padding:16px;position:relative;min-height:300px;overflow:hidden}

.page.cols3{grid-template-columns:repeat(3,auto);justify-content:center}

.page .card.sz-md{--cw:min(176px,28vw)}

body[data-mode=mobile] .page .card.sz-md{--cw:min(176px,42vw)}
.page-nav{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.ms-list{display:flex;flex-direction:column;gap:8px}
.ms{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.ms>span svg{width:22px;height:22px}
.ms.done{border-color:var(--ok)}.ms.done>span{color:var(--ok)}.ms.claim{border-color:var(--gold);animation:glowb 1.2s infinite alternate}.ms.claim>span{color:var(--gold)}
@keyframes glowb{to{box-shadow:0 0 18px #ffd24a66}}
.rar-prog{display:grid;grid-template-columns:100px 1fr 60px;gap:8px;align-items:center;font-size:.8rem;font-weight:700}
.dupe-bar{position:sticky;top:-12px;z-index:5;display:flex;flex-direction:column;gap:10px;padding:12px;margin-bottom:12px;background:rgba(23,21,58,.97)!important}

.dupe-sum{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dupe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}

.dupe{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 8px;border-radius:16px;background:var(--panel);border:2px solid transparent;transition:border-color .2s,background .2s,transform .15s}

.speech{padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid var(--line);min-height:3.2em;font-size:.95rem;font-weight:600}
.verdict{display:flex;gap:4px}

.verdict i.on0{background:#ef4444}.verdict i.on1{background:#f59e0b}.verdict i.on2{background:#a3e635}.verdict i.on3{background:#22c55e;box-shadow:0 0 12px #22c55e}
.vlabel{font-weight:800;font-size:.95rem}
.coinbox{display:flex;align-items:center;gap:8px}

.handshake{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:20;animation:hs 1.2s forwards;color:var(--gold)}

.flycard{position:fixed;z-index:400;pointer-events:none;transition:transform .8s cubic-bezier(.5,0,.3,1),opacity .8s}
.offer-chip{position:relative}
.offer-chip b{position:absolute;right:-4px;top:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);font-size:.72rem;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* =====================================================================
   WEITERE ANSICHTEN
   ===================================================================== */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.kpi{padding:14px}.kpi small{color:var(--dim);display:block;margin-bottom:4px;font-weight:700}.kpi b{font-size:1.3rem;font-family:var(--font-d);font-weight:600;display:flex;gap:6px;align-items:center}

.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}

.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}

input[type=range]{accent-color:var(--acc);width:180px;min-height:30px}

.switch.on{background:var(--ok)}.switch.on::after{transform:translateX(22px)}
textarea.inp{min-height:90px;font-family:monospace;font-size:.8rem;user-select:text}
.help h3{margin-top:16px}.help p,.help li{color:#d5d2f5;line-height:1.55;max-width:70ch}
canvas.chart{width:100%;height:240px;display:block}
.tut{position:absolute;inset:0;pointer-events:auto;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:16px}

   LIVE CITY
   ===================================================================== */

#joy{position:absolute;left:calc(22px + var(--sai-l));bottom:calc(26px + var(--sai-b));width:136px;height:136px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08),rgba(255,255,255,.2));border:2px solid rgba(255,255,255,.45);display:none;touch-action:none}

#cityNoGl{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:linear-gradient(160deg,#1b1250,#080818);text-align:center;padding:24px;z-index:5}

/* =====================================================================
   HUNDE-KAMPF & TEAM
   ===================================================================== */
#battleOv{position:absolute;inset:0;pointer-events:auto;overflow:hidden;z-index:60;display:flex;flex-direction:column;background:#0b0a24;touch-action:manipulation;user-select:none}
#battleOv .bt-sky{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 0,#6fb7ff 0,#3d7fd6 40%,#1b2a6b 100%)}
#battleOv .bt-sky::after{content:"";position:absolute;inset:0;background:radial-gradient(40% 25% at 20% 18%,#fff9 0,#fff0 70%),radial-gradient(35% 20% at 78% 30%,#fff7 0,#fff0 70%)}
#battleOv .bt-ground{position:absolute;left:-10%;right:-10%;top:34%;bottom:0;background:radial-gradient(70% 45% at 50% 18%,#8fd16a 0,#5fa44b 55%,#3f7a3a 100%);border-radius:50% 50% 0 0/14% 14% 0 0}
#battleOv .bt-top{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + var(--sai-t)) 14px 0}
#battleOv .bt-arena{position:relative;z-index:2;flex:1;min-height:0;max-width:760px;width:100%;margin:0 auto}
.bt-foe,.bt-me{position:absolute;display:flex;align-items:center;gap:10px}
.bt-foe{right:3%;top:2%;flex-direction:row}
.bt-me{left:3%;bottom:12px;flex-direction:row}
.bt-dog{position:relative;width:min(38vw,190px);aspect-ratio:1;flex:none;filter:drop-shadow(0 10px 8px rgba(0,0,0,.35))}
.bt-dog::before{content:"";position:absolute;left:8%;right:8%;bottom:-6%;height:14%;border-radius:50%;background:rgba(0,0,0,.28);filter:blur(4px)}
.bt-dog svg{position:relative;width:100%;height:100%}
.bt-dog.enter{animation:btIn .55s var(--ease-spring)}
@keyframes btIn{from{opacity:0;transform:translateY(30px) scale(.6)}}
.bt-box{width:min(52vw,250px);background:linear-gradient(180deg,#1b1650f2,#0e0b30f2);border:2px solid #ffffff30;border-radius:16px;padding:8px 11px 9px;box-shadow:0 8px 20px #0007;font-size:.82rem}
.bt-nm{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:5px}
.bt-nm b{font-family:var(--font-d);font-size:.92rem;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt-nm .rar{font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:99px;color:#111;background:var(--c);flex:none}
.hp{position:relative;height:16px;border-radius:99px;background:#0008;overflow:hidden;border:1px solid #ffffff22}
.hp i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(180deg,#86efac,#22c55e);transition:width .55s cubic-bezier(.3,1,.4,1)}
.hp.low i{background:linear-gradient(180deg,#fca5a5,#ef4444)}
.hp span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:800;text-shadow:0 1px 2px #000}
.bt-st{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.bt-st .pips{display:flex;gap:4px}.bt-st .pips i{width:9px;height:9px;border-radius:50%;background:#ffffff40}.bt-st .pips i.cur{background:#fff;box-shadow:0 0 6px #fff}.bt-st .pips i.dead{background:#ef444488}
.bt-st .chg{display:flex;gap:4px}.bt-st .chg u{width:16px;height:7px;border-radius:3px;background:#ffffff26;text-decoration:none}.bt-st .chg u.on{background:linear-gradient(90deg,#ffd24a,#ff8a3d);box-shadow:0 0 8px #ffb300}
.bt-log{position:relative;z-index:3;margin:0 auto 8px;min-height:2.4em;max-width:560px;width:calc(100% - 28px);padding:9px 14px;border-radius:14px;background:#0b0a24d9;border:1px solid #ffffff2a;text-align:center;font-weight:800;font-family:var(--font-d);font-size:1rem}
.bt-log.pop{animation:popIn .3s var(--ease-spring)}
@keyframes popIn{from{transform:scale(.94);opacity:.4}}
.bt-cmd{position:relative;z-index:3;padding:0 12px calc(12px + var(--sai-b));max-width:620px;width:100%;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:9px;transition:opacity .2s}
.bt-cmd.off{opacity:.45;pointer-events:none}
.bt-mv{position:relative;display:grid;grid-template-columns:34px 1fr;grid-template-rows:auto auto;column-gap:9px;align-items:center;text-align:left;padding:10px 12px;min-height:58px;border-radius:16px;border:2px solid #ffffff2c;color:#fff;background:linear-gradient(180deg,#2a2370,#16123f);box-shadow:0 5px 0 #0a0820,0 10px 18px #0006;transition:transform .08s,box-shadow .08s,filter .2s}
.bt-mv:active{transform:translateY(4px);box-shadow:0 1px 0 #0a0820}
.bt-mv .mi{grid-row:1/3;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:#ffffff1c}
.bt-mv .mi svg{width:20px;height:20px}
.bt-mv b{font-family:var(--font-d);font-size:1rem;line-height:1.1}
.bt-mv small{color:#c9c7ee;font-size:.7rem;line-height:1.1}
.bt-mv.mv-bite{background:linear-gradient(180deg,#b3392c,#7a1d1a)}
.bt-mv.mv-scratch{background:linear-gradient(180deg,#2b78c9,#1a4a8a)}
.bt-mv.mv-guard{background:linear-gradient(180deg,#2f9a64,#1b6040)}
.bt-mv.mv-special{background:linear-gradient(180deg,#8b3fd9,#52208f)}
.bt-mv.mv-special.ready{animation:spReady 1s ease-in-out infinite;border-color:#ffd24a}
@keyframes spReady{50%{box-shadow:0 5px 0 #0a0820,0 0 24px #ffb300}}
.bt-mv.locked{filter:grayscale(.7) brightness(.7)}
.bt-mv.mv-sw{background:linear-gradient(180deg,#4b5563,#2b303b);grid-column:1/-1;min-height:46px}
.bt-cmd.res{display:block}
.bt-sw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bt-swt{grid-column:1/-1;font-family:var(--font-d);font-weight:700;text-align:center;margin-bottom:6px}
.bt-cmd:has(.bt-sw){display:block}
.bt-swb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;border:2px solid #ffffff30;background:linear-gradient(180deg,#2a2370,#16123f);color:#fff}
.bt-swb .sw-ic{width:62px;height:62px}.bt-swb .sw-ic svg{width:100%;height:100%}
.bt-swb b{font-size:.78rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bt-swb small{font-size:.66rem;color:#c9c7ee}
.bt-swb.dead{opacity:.4}.bt-swb.cur{border-color:#ffd24a}
.bt-num{position:absolute;z-index:8;transform:translate(-50%,0);font:800 1.9rem var(--font-d);color:#fff;text-shadow:0 2px 0 #000,0 0 10px #000;pointer-events:none;animation:btNum 1s ease-out forwards}
.bt-num.crit{color:#ffd24a;font-size:2.5rem}.bt-num.spec{color:#d8b4fe;font-size:2.4rem}.bt-num.heal{color:#86efac}.bt-num.miss{color:#cbd5e1;font-size:1.3rem}
@keyframes btNum{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}15%{opacity:1;transform:translate(-50%,-6px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.bt-res{text-align:center;padding:14px;border-radius:20px;background:linear-gradient(180deg,#1b1650f5,#0e0b30f5);border:2px solid #ffffff30;box-shadow:0 10px 30px #000a;animation:popIn .4s var(--ease-spring)}
.bt-res h2{margin:0 0 8px;font-family:var(--font-d);font-size:1.7rem;display:flex;gap:8px;align-items:center;justify-content:center}
.bt-res.win h2{color:#ffd24a}
.bt-rw{display:flex;gap:18px;justify-content:center;font-family:var(--font-d);font-weight:700;font-size:1.15rem;margin-bottom:6px}
.bt-rec{display:flex;flex-direction:column;align-items:center;gap:8px;margin:8px 0;padding:10px;border-radius:14px;background:#ffffff10}
.bt-pre{display:flex;gap:12px;align-items:center}
.bt-pre-art{width:88px;height:88px;flex:none;border-radius:16px;background:radial-gradient(circle,#ffffff22,#ffffff08);border:1px solid var(--line)}.bt-pre-art svg{width:100%;height:100%}
.bt-diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bt-diff{display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center;padding:12px 6px;border-radius:14px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 14%,#13103a);color:#fff}
.bt-diff b{font-family:var(--font-d);font-size:1.05rem;color:var(--c)}.bt-diff small{font-size:.7rem;line-height:1.2}
.bt-diff:active{transform:scale(.96)}
.tm-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tm-slot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:150px;border-radius:16px;border:2px dashed var(--line);background:#ffffff08;color:inherit;padding:8px 4px}
.tm-slot.on{border-style:solid;border-color:var(--gold);background:#ffd24a12}
.tm-slot small{font-size:.66rem;color:var(--dim);text-align:center}
.tm-slot .x{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;background:#000a;display:flex;align-items:center;justify-content:center}.tm-slot .x svg{width:12px;height:12px}
.tm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.tm-it{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;border-radius:14px;border:2px solid transparent}
.tm-it.on{border-color:var(--gold);background:#ffd24a14}
.tm-it small{font-size:.72rem;color:var(--dim);display:flex;gap:4px;align-items:center}
body[data-mode=mobile] #battleOv .bt-dog{width:min(40vw,160px)}
body[data-mode=mobile] .bt-box{width:min(54vw,230px)}
@media (max-height:560px){#battleOv .bt-dog{width:min(24vh,140px)}.bt-mv{min-height:46px;padding:6px 10px}.bt-cmd{grid-template-columns:repeat(4,1fr)}.bt-mv small{display:none}.bt-mv{grid-template-columns:28px 1fr}}

/* Fang-Begegnung */

.go-top{position:absolute;z-index:4;left:0;right:0;top:0;padding:calc(10px + var(--sai-t)) 14px 0;display:flex;justify-content:space-between;align-items:flex-start}

/* ------------------------------ SPECIAL EDITIONS ------------------------------ */
/* Zusätzliche Ebene über den 999 Karten: jede gezogene Karte kann (unabhängig von ihrer Seltenheit)
   als Special Edition erscheinen. Specials zählen als Kopie im Album, sind aber nicht tausch-/quick-sellbar. */
const EDITIONS = [
  { id: 'shiny', name: 'Shiny', icon: '{i:sparkle}', color: '#7df9ff', p: 1 / 40, mult: 5 },
  { id: 'gold', name: 'Gold', icon: '{i:medal}', color: '#ffd24a', p: 1 / 150, mult: 20 },
  { id: 'diamond', name: 'Diamant', icon: '{i:diamond}', color: '#b9f2ff', p: 1 / 600, mult: 100 },
  { id: 'prisma', name: 'Prisma', icon: '{i:rainbow}', color: '#ff7ad9', p: 1 / 2500, mult: 500 }
];
const ED_BY = Object.fromEntries(EDITIONS.map(e => [e.id, e]));
const ED_BOOST = [1, 1.15, 1.35, 1.7, 2.1, 2.7, 3.4, 4.2];       // höhere Packs = bessere Edition-Chance
const ED_MS = [[1, 2000, 0.05], [5, 8000, 0.1], [25, 50000, 0.2], [100, 300000, 0.4], [500, 3000000, 0.8]];
const Ed = {
  count(id, e) { const m = S().ed[id]; return (m && m[e]) || 0; },
  total(id) { const m = S().ed[id]; return m ? Object.values(m).reduce((a, b) => a + b, 0) : 0; },
  spare(id) { return Math.max(0, (S().cards[id] || 0) - this.total(id)); },     // frei verfügbare (nicht-special) Exemplare
  has(id) { return !!S().ed[id]; },
  owned(id) { return EDITIONS.filter(e => this.count(id, e.id) > 0); },
  distinct(e) { let n = 0; for (const k in S().ed) if (S().ed[k][e]) n++; return n; },
  copies() { let n = 0; for (const k in S().ed) n += this.total(+k); return n; },
  probs(pack) { const idx = PACKS.indexOf(pack), lf = Math.min(2.5, Math.pow(Economy.effLuck(), 0.3)); return EDITIONS.map(e => ({ ed: e, p: Math.min(0.5, e.p * ED_BOOST[Math.max(0, idx)] * lf) })); },
  roll(pack, rnd = Math.random) { const pr = this.probs(pack), x = rnd(); let acc = 0; for (let i = pr.length - 1; i >= 0; i--) { acc += pr[i].p; if (x < acc) return pr[i].ed; } return null; },
  value(card, e) { return card.value * ED_BY[e].mult; },
  sellValue(card, e) { return Math.floor(card.value * ED_BY[e].mult * Economy.QUICKSELL); },

const MAX_LUCK = 10;
const Economy = {

  QUICKSELL: 0.4,
  effLuck() { const e = this.event; return S().luck * (Date.now() < e.luckUntil ? e.luckMult : 1); },
  salePct() { return Date.now() < this.event.saleUntil ? this.event.salePct : 0; },
  packPrice(p) { return Math.max(1, Math.round(p.price * (1 - this.salePct()))); },
  unique() { return Object.keys(S().cards).length; },
  total() { return Object.values(S().cards).reduce((a, b) => a + b, 0); },
  collectionValue() { let v = 0; for (const id in S().cards) v += CardDB.get(+id).value * S().cards[id]; return v + Ed.extraValue(); },
  log(d, why) { if (!d) return; const l = S().ledger; l.unshift([Date.now(), Math.round(d), why || 'Sonstiges']); if (l.length > 80) l.length = 80; },
  add(n, silent, why) {

  },
  spend(n, why) {

  },
  addLuck(d, quiet) {

    const f = Math.max(0.15, 1 - (s.luck - 1) / 12);          // abnehmender Zuwachs nahe Maximum
    const before = s.luck; s.luck = clamp(s.luck + d * f, 1, MAX_LUCK);

  },
  softDropLuck() { const s = S(); s.luck = Math.max(1, 1 + (s.luck - 1) * 0.5); Bus.emit('luck', -1); },
  xpNeed(l) { return Math.round(60 * Math.pow(l, 1.6)); },
  addXp(n) {

  /* ---- Notfall-Coins ---- */
  noteAfford() {

    let best = CHEAPEST_PACK; for (const p of PACKS) if (p.price <= s.coins) best = Math.max(best, p.price);
    e.lastAfford = Math.max(e.lastAfford || 100, Math.min(best, 6000));
  },
  emergAmount() { return 3 * clamp(S().emerg.lastAfford || 100, CHEAPEST_PACK, 6000); },
  emergTick() {
    const s = S(), e = s.emerg, now = Date.now();
    const prog = Math.max(0, now - Math.max(e.tick || 0, e.seen || 0));   // Uhr rückwärts => kein Fortschritt
    e.tick = now; e.seen = Math.max(e.seen || 0, now);

    if (!e.at) { e.at = now; e.remain = 24 * 3600 * 1000; Store.save(); return { active: true, remain: e.remain, ready: false }; }

    const y = new Date(Date.now() - 864e5), ys = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');

  }
};

/* ------------------------------ PACK ENGINE ------------------------------ */
const PITY_MAX = 20;
const PackEngine = {
  weights(pack, luck, pity) {
    const eff = luck * (1 + 0.06 * pity);
    const w = pack.w.map((x, i) => x * Math.pow(eff, i / 8));
    const sum = w.reduce((a, b) => a + b, 0); return w.map(x => x / sum);
  },
  rollTier(probs, minTier, rnd) {
    let tot = 0; for (let t = minTier; t <= 12; t++) tot += probs[t - 1];
    let x = rnd() * tot;
    for (let t = minTier; t <= 12; t++) { x -= probs[t - 1]; if (x <= 0 && probs[t - 1] > 0) return t; }
    for (let t = 12; t >= minTier; t--) if (probs[t - 1] > 0) return t;
    return minTier;
  },
  draw(pack, luck, pity, rnd = Math.random) {
    const probs = this.weights(pack, luck, pity); const tiers = [];
    for (let i = 0; i < pack.count; i++) tiers.push(this.rollTier(probs, i === pack.count - 1 ? pack.minLast : 1, rnd));
    if (pity >= PITY_MAX && Math.max(...tiers) < pack.pityTier) tiers[tiers.length - 1] = this.rollTier(probs, pack.pityTier, rnd);   // Pity-Garantie
    tiers.sort((a, b) => a - b);
    return tiers.map(t => { const arr = CardDB.byTier[t]; return arr[Math.floor(rnd() * arr.length)]; });
  },
  open(packId, opts = {}) {
    const pack = PACK_BY_ID[packId]; if (!pack) return { error: 'unknown' };
    const s = S(); const price = opts.free ? 0 : Economy.packPrice(pack);
    if (!opts.free && s.coins < price) return { error: 'coins', need: price };
    if (!opts.free) Economy.spend(price, 'Pack: ' + pack.name);
    const luck = Economy.effLuck(), pity = s.pity[packId] || 0;
    const cards = this.draw(pack, luck, pity);
    const res = { pack, price, cards: [], best: null, value: 0, luckBefore: s.luck, dotd: null, bonusCoins: 0 };
    const dotdId = Economy.dotdCard().id; let newCount = 0, rare3 = 0;
    for (const c of cards) {
      const isNew = !s.disc[c.id]; if (isNew) { s.disc[c.id] = Date.now(); newCount++; }
      s.cards[c.id] = (s.cards[c.id] || 0) + 1;
      const ed = Ed.roll(pack); if (ed) { Ed.add(c.id, ed.id); res.edCount = (res.edCount || 0) + 1; Economy.addLuck(0.03 * (EDITIONS.indexOf(ed) + 1), true); Economy.addXp(15 * (EDITIONS.indexOf(ed) + 1)); if (!res.bestEd || ed.mult > ED_BY[res.bestEd.ed].mult) res.bestEd = { card: c, ed: ed.id }; }
      res.cards.push({ card: c, isNew, count: s.cards[c.id], edition: ed ? ed.id : null }); res.value += ed ? Ed.value(c, ed.id) : c.value;
      s.stats.tierPulled[c.tier]++; if (c.tier >= 3) rare3++;
      if (!res.best || c.tier > res.best.tier || (c.tier === res.best.tier && c.value > res.best.value)) res.best = c;
      if (c.id === dotdId && !s.dotd.claimed) { s.dotd = { day: todayStr(), claimed: true }; res.dotd = c; res.bonusCoins = Math.round(c.value * 3); s.stats.dotd++; }
    }
    s.stats.packs++; s.stats.spent += price; s.stats.pulled += cards.length; s.stats.value += res.value; s.stats.newCards += newCount;
    s.stats.packsByType[packId] = (s.stats.packsByType[packId] || 0) + 1;
    if (!s.stats.bestId || res.best.tier > CardDB.get(s.stats.bestId).tier || (res.best.tier === CardDB.get(s.stats.bestId).tier && res.best.value > CardDB.get(s.stats.bestId).value)) { s.stats.bestId = res.best.id; }
    s.stats.bestTier = Math.max(s.stats.bestTier, res.best.tier);
    // Pity
    s.pity[packId] = cards.some(c => c.tier >= pack.pityTier) ? 0 : pity + 1;
    // Luck: Zuwachs pro Pack, Teilrückfall bei sehr seltenen Karten
    const idx = PACKS.indexOf(pack);
    Economy.addLuck(0.012 * (1 + idx * 0.35), true);
    if (res.best.tier >= 6) { Economy.softDropLuck(); res.luckDropped = true; }
    if (res.bonusCoins) { Economy.add(res.bonusCoins, true, 'Hund des Tages'); Economy.addLuck(0.05, true); }
    Economy.addXp(8 + idx * 5 + newCount * 4 + res.best.tier * 3);
    Quests.progress('packs'); Quests.progress('new', newCount); Quests.progress('rare', rare3); if (price) Quests.progress('spend', price);
    res.luckAfter = s.luck; res.newCount = newCount;
    Ach.check(); Album.checkMilestoneToasts(); Economy.emergTick();
    Store.save(true);                       // Speichern VOR der Animation
    Bus.emit('coins', 0); Bus.emit('luck', 0); Bus.emit('stateChanged');
    return res;
  },
  /* Anzeige: aktuelle Chancen in % */
  chances(pack, packId) { const pity = S().pity[pack.id] || 0; return this.weights(pack, Economy.effLuck(), pity).map(x => x * 100); },
  baseChances(pack) { return this.weights(pack, 1, 0).map(x => x * 100); },
  quickSell(id, n = 1) {
    const s = S(), c = CardDB.get(id); const own = Ed.spare(id);
    if (!c || !isInt(n) || n < 1 || own - n < 1 || (s.cards[id] || 0) - n < 1) return 0;           // letztes Exemplar bleibt im Album, Specials sind geschützt
    s.cards[id] -= n; const coins = Math.floor(c.value * Economy.QUICKSELL) * n;
    Economy.add(coins, true, 'Duplikate verkauft'); s.stats.quicksold += n; Quests.progress('sell', n); Ach.check(); Store.save(true); Audio.coins(3);
    Bus.emit('stateChanged'); return coins;
  },
  quickSellAllDupes(maxTier = 12) {
    let tot = 0, n = 0; const s = S();
    for (const k of Object.keys(s.cards)) { const c = CardDB.get(+k); const sp = Ed.spare(+k); if (c.tier <= maxTier && sp > 1) { const q = sp - 1; const g = this.quickSell(+k, q); tot += g; n += q; } }
    return { coins: tot, n };
  }
};

/* ------------------------------ DEV / TESTS ------------------------------ */
const Dev = {
  /* Simuliert n Pulls eines Packs (ohne Spielstand zu verändern) und gibt die Verteilung aus. */
  simulate(packId = 'alpha', n = 100000, luck = 1, usePity = true) {
    const pack = PACK_BY_ID[packId]; if (!pack) { console.error('Unbekanntes Pack', Object.keys(PACK_BY_ID)); return; }
    const edc = {}; const counts = new Array(13).fill(0); let value = 0, pity = 0, cards = 0, bestSum = 0;
    for (let i = 0; i < n; i++) {
      const drawn = PackEngine.draw(pack, luck, usePity ? pity : 0); let hit = false;
      for (const c of drawn) { counts[c.tier]++; value += c.value; cards++; const ed = Ed.roll(pack); if (ed) edc[ed.id] = (edc[ed.id] || 0) + 1; if (c.tier >= pack.pityTier) hit = true; }
      pity = hit ? 0 : pity + 1;
    }
    const exp = PackEngine.weights(pack, luck, 0).map(x => x * 100);
    const rows = RAR.slice(1).map(r => ({ Stufe: r.name, Anzahl: counts[r.t], 'Anteil %': +(counts[r.t] / cards * 100).toFixed(4), 'Erwartet % (ohne Pity)': +exp[r.t - 1].toFixed(4) }));
    const sumExp = exp.reduce((a, b) => a + b, 0);
    console.log(`%cSimulation ${pack.name}: ${n} Packs, Luck x${luck}, Pity ${usePity ? 'an' : 'aus'}`, 'font-weight:bold'); console.table(rows);
    console.log('Special Editions pro Karte:', Object.fromEntries(EDITIONS.map(e => [e.id, `${fmtPct((edc[e.id] || 0) / cards * 100)} (1:${Math.round(cards / Math.max(1, edc[e.id] || 0))}) erwartet 1:${Math.round(1 / Ed.probs(pack).find(x => x.ed.id === e.id).p)}`])));
    const ev = value / n; console.log(`Σ Erwartung = ${sumExp.toFixed(6)} %  ·  Ø Kartenwert/Pack = ${fmt(ev)} (Preis ${fmt(pack.price)} → Wert/Preis ${(ev / pack.price).toFixed(2)}, Quick-Sell ${(ev * Economy.QUICKSELL / pack.price).toFixed(2)})`);
    return { counts, ev, ratio: ev / pack.price, sumExp, rows };
  },
  tables() { PACKS.forEach(p => { const w = PackEngine.baseChances(p), s = w.reduce((a, b) => a + b, 0); console.log(p.name, p.price, w.map(x => x.toFixed(3)).join(' | '), 'Σ=' + s.toFixed(6)); }); },
  /* Prüft Luck-Math und TradeAI-Invarianten */
  selfTest() {
    const out = []; const ok = (name, cond, info = '') => { out.push({ Test: name, OK: !!cond, Info: info }); };
    PACKS.forEach(p => [1, 2.5, 6, 10].forEach(L => { const s = PackEngine.weights(p, L, 0).reduce((a, b) => a + b, 0); ok(`Σ Wahrscheinlichkeit ${p.id} x${L} = 100 %`, Math.abs(s - 1) < 1e-9, s); }));
    const lo = PackEngine.weights(PACK_BY_ID.alpha, 1, 0), hi = PackEngine.weights(PACK_BY_ID.alpha, 8, 0); ok('Luck erhöht Chance auf Mythisch', hi[5] > lo[5], `${lo[5]} → ${hi[5]}`);
    const npc = NPCS[1]; TradeAI.state(npc);
    const commons = CardDB.byTier[1].slice(0, 20).map(c => ({ id: c.id, n: 1 })); const pv = TradeAI.playerCardsValue(npc, commons).total; const leg = CardDB.byTier[5][0];
    ok('20 Gewöhnliche < 1 Legendäre', pv < leg.value, `${Math.round(pv)} < ${leg.value}`);
    const pvLeg = TradeAI.playerCardsValue(npc, [{ id: leg.id, n: 1 }]).total; ok('Legendär zählt exponentiell mehr', pvLeg > 5 * TradeAI.playerCardsValue(npc, [{ id: CardDB.byTier[4][0].id, n: 1 }]).total * 0.5);
    ok('Wert wächst ca. ×3,5 pro Stufe', Math.abs(CardDB.byTier[6].reduce((a, c) => a + c.value, 0) / 60 / (CardDB.byTier[5].reduce((a, c) => a + c.value, 0) / 90) - 3.5) < 0.3);
    ok('999 Karten', CardDB.cards.length === 999);
    console.table(out); const bad = out.filter(o => !o.OK); console.log(bad.length ? 'FEHLER: ' + bad.length + ' Tests fehlgeschlagen' : 'OK: Alle ' + out.length + ' Tests bestanden'); return bad.length === 0;
  },
  special(id, ed = 'shiny') { const s = S(); s.cards[id] = (s.cards[id] || 0) + 1; s.disc[id] = s.disc[id] || Date.now(); Ed.add(id, ed); Store.save(true); UI.rerender(); },
  give(n) { Economy.add(n); UI.refreshHud(); },
  cards(...ids) { ids.forEach(id => { S().cards[id] = (S().cards[id] || 0) + 1; S().disc[id] = S().disc[id] || Date.now(); }); Store.save(true); UI.rerender(); },
  state: () => S(), city: City, ui: UI, packs: PACKS, db: CardDB, trade: TradeAI, econ: Economy, engine: PackEngine
};
window.Dev = Dev;


/* ------------------------------ KARTEN-ZOOM (gedrückt halten / Rechtsklick / Maus-Hover) ------------------------------ */
const CardZoom = (() => {
  let timer = 0, hoverT = 0, down = null, blockUntil = 0, box = null, hov = null;
  const okCard = c => c && !c.closest('#packOv,#cardZoom,#cutLayer,#cardHover') && !c.classList.contains('locked') && !c.classList.contains('down');
  const edOf = c => { const m = /\bed-(\w+)/.exec(c.className); return m && ED_BY[m[1]] ? m[1] : null; };
  function content(c, big) {
    const id = +c.dataset.id, card = CardDB.get(id), ed = edOf(c), s = S(), st = Dogs.stats(card);
    const wrap = el('div', { class: 'cz-wrap' }, renderCard(card, { size: big ? 'xl' : 'lg', owned: true, odds: true, live: true, edition: ed }));
    wrap.append(el('div', { class: 'cz-info' }, el('b', { class: 'tc' + card.tier }, card.name), el('div', { class: 'dim' }, `${RAR[card.tier].name} · ${card.country}${card.breed ? ' · ' + card.breed : ''}`), el('div', { class: 'cz-st' }, el('span', {}, '{i:heart} LP ' + st.maxHp), el('span', {}, '{i:sword} Angriff ' + st.atk), el('span', {}, '{i:bolt} Tempo ' + st.spd), el('span', {}, '{i:coin} ' + fmt(ed ? Ed.value(card, ed) : card.value))), s.cards[id] ? el('div', { class: 'dim', style: 'font-size:.8rem' }, `Du besitzt ${s.cards[id]}×`) : null));
    return wrap;
  }
  function open(c) {
    close(); hideHover(); box = el('div', { id: 'cardZoom', role: 'dialog', 'aria-label': 'Kartenansicht' }); box.append(content(c, true), el('div', { class: 'cz-hint' }, 'Karte antippen zum Umdrehen · daneben tippen zum Schließen'));
    box.addEventListener('click', e => { const cd = e.target.closest('.card'); if (cd) { cd.classList.toggle('flipped'); Audio.flip(); } else close(); });
    document.body.append(box); Audio.soft(); try { navigator.vibrate && navigator.vibrate(12); } catch (e) { }
  }
  function close() { if (box) { box.remove(); box = null; } }
  function hideHover() { clearTimeout(hoverT); if (hov) { hov.remove(); hov = null; } }
  function showHover(c, x, y) {
    hideHover(); hov = el('div', { id: 'cardHover' }, content(c, false)); document.body.append(hov);
    const w = 330, h = 520, px = x + 24 + w > innerWidth ? x - 24 - w : x + 24; hov.style.left = Math.max(8, px) + 'px'; hov.style.top = clamp(y - h / 2, 8, Math.max(8, innerHeight - h - 8)) + 'px';
  }
  document.addEventListener('pointerdown', e => {
    const c = e.target.closest && e.target.closest('.card[data-id]'); if (!okCard(c) || (e.pointerType === 'mouse' && e.button !== 0)) return;
    hideHover(); down = { x: e.clientX, y: e.clientY, c }; clearTimeout(timer); timer = setTimeout(() => { if (down) { blockUntil = performance.now() + 900; open(down.c); down = null; } }, 480);
  }, true);
  document.addEventListener('pointermove', e => {
    if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 12) { clearTimeout(timer); down = null; }
    if (e.pointerType === 'mouse' && !box) {
      const c = e.target.closest && e.target.closest('.card[data-id]');
      if (okCard(c) && c.querySelector('.sz-xs,.sz-mini') !== null || (okCard(c) && /\bsz-(xs|sm|mini)\b/.test(c.className))) { if (!hov && !hoverT) hoverT = setTimeout(() => { hoverT = 0; showHover(c, e.clientX, e.clientY); }, 420); } else { clearTimeout(hoverT); hoverT = 0; hideHover(); }
    }
  }, true);
  const cancel = () => { clearTimeout(timer); down = null; };
  document.addEventListener('pointerup', cancel, true); document.addEventListener('pointercancel', cancel, true);
  document.addEventListener('click', e => { if (performance.now() < blockUntil) { e.stopPropagation(); e.preventDefault(); } }, true);
  document.addEventListener('contextmenu', e => { const c = e.target.closest && e.target.closest('.card[data-id]'); if (okCard(c)) { e.preventDefault(); open(c); } }, true);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && box) { e.stopPropagation(); close(); } }, true);
  window.addEventListener('scroll', hideHover, true);
  return { open, close };
})();

/* ------------------------------ BOOT ------------------------------ */
(function boot() {
  const bar = $('#loadBar'), tip = $('#loadTip'); tip.textContent = pick(TIPS); bar.style.width = '20%';
  const fail = e => { console.error(e); $('#loading .big').textContent = '{i:alert}'; tip.textContent = 'Fehler beim Start: ' + (e && e.message || e); tip.style.color = '#fb7185'; };
  ['#loading .big', '#btnSprint', '#btnThrow', '#btnAct', '#cityNoGl .ng-ic'].forEach(q => { const e = $(q); if (e) e.innerHTML = e.innerHTML; });
  try {
    Store.load(); UI.applySettings(); Device.init(); Audio.prerender(); bar.style.width = '50%';
    Quests.ensure(); Economy.noteAfford(); NPCQuests.ensure(); Album._lastClaimable = Album.claimable();
    UI.buildHud(); UI.buildNav(); Device.on(() => { UI.buildNav(); UI.rerender(); });
    Bus.on('coins', () => UI.refreshHud()); Bus.on('luck', () => { UI.pulseLuck(); UI.refreshHud(); }); Bus.on('xp', () => UI.refreshHud()); Bus.on('toast', (m, k) => UI.toast(m, k)); Bus.on('stateChanged', () => { UI.refreshHud(); if (UI.view === 'album' && !UI.inCity) Album.refresh(); }); Bus.on('offers', () => UI.refreshHud()); Bus.on('quests', () => UI.refreshHud()); Bus.on('ach', () => UI.refreshHud());
    $('#noGlBack').onclick = () => UI.leaveCity();
    // Tastatur
    window.addEventListener('keydown', e => {
      if (/INPUT|TEXTAREA|SELECT/.test((e.target.tagName || ''))) return; if (UI.inCity || UI.modalOpen()) return;
      if (e.key >= '1' && e.key <= '8' && !e.ctrlKey && !e.metaKey && !e.altKey) { const n = NAV[+e.key - 1]; if (n) UI.go(n[0]); }
      else if (UI.view === 'album') Album.key(e);
    });
    // Zeit-Tick (Spielzeit, Notfall-Coins, NPC-Angebote)
    setInterval(() => { if (document.hidden) return; S().stats.playMs += 1000; Quests.ensure(); NPCQuests.ensure(); UI.tickHud(); Offers.clean(); if (Math.random() < 0.012 && S().settings.tutorial) Offers.maybeCreate(); if (S().stats.playMs % 30000 < 1000) Store.save(); }, 1000);
    setInterval(() => { if (!document.hidden && UI.view === 'history' && !UI.inCity && !UI.modalOpen()) UI.rerender(); }, 15000);
    document.addEventListener('visibilitychange', () => { Store.save(true); if (City.running) City.suspend(document.hidden || !!$('#packOv')); if (!document.hidden) { Economy.emergTick(); UI.refreshHud(); } });
    window.addEventListener('pagehide', () => { Store.save(true); });
    window.addEventListener('beforeunload', () => { Store.save(true); });
    window.addEventListener('error', e => { console.error('Fehler:', e.message); });
    matchMedia && REDUCED_MQ.addEventListener && REDUCED_MQ.addEventListener('change', () => UI.applySettings());
    bar.style.width = '85%';
    setTimeout(() => {
      bar.style.width = '100%'; UI.go('packs'); UI.tickHud();
      setTimeout(() => { const l = $('#loading'); l.style.opacity = 0; setTimeout(() => l.remove(), 700); if (!S().settings.tutorial) { UI.tutorial(); } else UI.dailyPopup(); }, 250);
    }, 700);
    console.log('%cDog Packs bereit. Tipp: Dev.simulate("alpha", 100000), Dev.selfTest(), Dev.tables()', 'color:#7c5cff;font-weight:bold');
  } catch (e) { fail(e); }
})();
