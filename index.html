<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dog Packs – Pack-Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* =====================================================================
   DESIGN SYSTEM
   ===================================================================== */
:root{
  --bg0:#080818;--bg1:#0f1030;--bg2:#1a1446;--panel:rgba(255,255,255,.07);--panel2:rgba(255,255,255,.11);
  --line:rgba(255,255,255,.14);--txt:#f2f3ff;--dim:#a9acd0;--acc:#7c5cff;--acc2:#22d3ee;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24;
  --gold:#ffd24a;--r-s:8px;--r-m:14px;--r-l:22px;--sh:0 10px 30px rgba(0,0,0,.45);--sp:12px;
  --font:'Fredoka',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --sai-t:env(safe-area-inset-top,0px);--sai-b:env(safe-area-inset-bottom,0px);--sai-l:env(safe-area-inset-left,0px);--sai-r:env(safe-area-inset-right,0px);
  --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--txt);font-family:var(--font);font-size:16px;overscroll-behavior:none;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{background:radial-gradient(1200px 800px at 20% -10%,#2b1a6e55,transparent 60%),radial-gradient(900px 700px at 110% 110%,#0e749033,transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg0) 70%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:600}
.hidden{display:none!important}
.dim{color:var(--dim)}
.row{display:flex;gap:var(--sp);align-items:center}
.col{display:flex;flex-direction:column;gap:var(--sp)}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.center{text-align:center}
.mono{font-variant-numeric:tabular-nums}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:var(--r-m);background:linear-gradient(180deg,#8d70ff,#6a44f0);box-shadow:0 4px 0 #3b23a8,0 8px 18px rgba(80,50,220,.35);font-weight:600;transition:transform .08s,filter .15s,box-shadow .08s;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3b23a8,0 3px 8px rgba(80,50,220,.35)}
.btn.sec{background:linear-gradient(180deg,#3a3d75,#2b2e5c);box-shadow:0 4px 0 #1a1c3d}
.btn.gold{background:linear-gradient(180deg,#ffd24a,#f59e0b);color:#3b2400;box-shadow:0 4px 0 #a15c00,0 8px 18px rgba(245,158,11,.3)}
.btn.good{background:linear-gradient(180deg,#34d399,#059669);box-shadow:0 4px 0 #04684a}
.btn.danger{background:linear-gradient(180deg,#fb7185,#e11d48);box-shadow:0 4px 0 #8f1233}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.88rem}
.btn[disabled],.btn.off{filter:grayscale(.9) brightness(.7);pointer-events:none}
.icon-btn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--line);font-size:1.2rem}
.icon-btn:hover{background:rgba(255,255,255,.2)}
body[data-mode=mobile] .btn,body[data-mode=mobile] .icon-btn{min-height:48px}
body[data-mode=mobile] .icon-btn{width:48px;height:48px}
body[data-mode=mobile] .btn.sm{min-height:44px}

/* ---------- Glass ---------- */
.glass{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--sh)}
.pad{padding:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:.82rem}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.gold>i{background:linear-gradient(90deg,#f59e0b,#ffe27a)}
.bar.green>i{background:linear-gradient(90deg,#059669,#6ee7b7)}

/* =====================================================================
   APP LAYOUT
   ===================================================================== */
#app{position:fixed;inset:0;display:grid;grid-template-columns:210px 1fr;grid-template-rows:auto 1fr;padding:var(--sai-t) var(--sai-r) var(--sai-b) var(--sai-l)}
#hud{grid-column:1/-1;display:flex;gap:10px;align-items:center;padding:8px 14px;background:rgba(8,8,24,.7);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);z-index:20;flex-wrap:wrap}
#hud .logo{font-weight:700;font-size:1.25rem;letter-spacing:.5px;background:linear-gradient(90deg,#ffd24a,#ff7ab8);-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:auto;white-space:nowrap}
.hud-item{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line);min-height:40px;white-space:nowrap}
.hud-item b{font-variant-numeric:tabular-nums}
#hudCoins b{color:var(--gold)}
#hudLuck .lk{position:relative;width:54px;height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
#hudLuck .lk i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#22d3ee,#a855f7,#ffd24a);width:0;transition:width .6s}
#hudLuck.pulse{animation:pulse .8s}
@keyframes pulse{40%{transform:scale(1.15);box-shadow:0 0 22px #a855f7}}
#hudXp .xb{width:60px}
#hudEmerg{color:var(--warn)}
#nav{display:flex;flex-direction:column;gap:6px;padding:12px;overflow:auto;border-right:1px solid var(--line);background:rgba(8,8,24,.35)}
#nav button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-m);text-align:left;color:var(--dim);transition:background .15s,color .15s,transform .1s;position:relative}
#nav button:hover{background:var(--panel2);color:var(--txt)}
#nav button.active{background:linear-gradient(90deg,rgba(124,92,255,.45),rgba(34,211,238,.18));color:#fff;box-shadow:inset 0 0 0 1px var(--line)}
#nav button .ico{font-size:1.3rem;width:28px;text-align:center}
#nav button .kbd{margin-left:auto;font-size:.72rem;opacity:.5;border:1px solid var(--line);border-radius:5px;padding:0 5px}
#nav button.city{background:linear-gradient(90deg,#f59e0b,#ef4444);color:#fff;margin-top:6px;font-weight:600}
#nav .badge{position:absolute;right:10px;top:8px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);font-size:.7rem;display:flex;align-items:center;justify-content:center;padding:0 4px}
#view{overflow:auto;padding:18px;position:relative;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
#view>section{max-width:1280px;margin:0 auto;animation:viewIn .35s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}}
.view-title{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.view-title h2{font-size:1.6rem}

body[data-mode=mobile] #app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
body[data-mode=mobile] #hud{padding:6px 10px;gap:6px}
body[data-mode=mobile] #hud .logo{display:none}
body[data-mode=mobile] .hud-item{padding:4px 10px;min-height:36px;font-size:.9rem}
body[data-mode=mobile] #hudXp .xb,body[data-mode=mobile] #hudLuck .lk{display:none}
body[data-mode=mobile] #nav{flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:4px 4px;gap:2px;background:rgba(8,8,24,.92);order:3;overflow:hidden}
body[data-mode=mobile] #nav button{flex-direction:column;gap:2px;padding:6px 4px;font-size:.66rem;flex:1;min-width:0;min-height:var(--nav-h);justify-content:center;text-align:center}
body[data-mode=mobile] #nav button .ico{font-size:1.35rem}
body[data-mode=mobile] #nav button .kbd{display:none}
body[data-mode=mobile] #nav button.city{margin-top:0;border-radius:var(--r-m)}
body[data-mode=mobile] #view{padding:12px}
@media (max-width:420px){body[data-mode=mobile] #nav button span.lbl{font-size:.6rem}}

/* =====================================================================
   PACK SHOP
   ===================================================================== */
.grid{display:grid;gap:16px}
.pack-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
body[data-mode=mobile] .pack-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pack-tile{position:relative;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center;transition:transform .2s,box-shadow .2s;overflow:hidden}
.pack-tile:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(0,0,0,.5),0 0 28px var(--pc,#7c5cff)44}
.pack-art{--pc:#7c5cff;position:relative;width:128px;height:176px;border-radius:12px 12px 10px 10px;background:linear-gradient(160deg,var(--pc),#1a1446 130%);box-shadow:0 10px 24px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.25),0 0 22px color-mix(in srgb,var(--pc) 55%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden;transform-style:preserve-3d}
.pack-art::before,.pack-art::after{content:"";position:absolute;left:0;right:0;height:14px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 4px,rgba(0,0,0,.25) 4px 8px)}
.pack-art::before{top:0}.pack-art::after{bottom:0}
.pack-art .pe{font-size:3.2rem;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.pack-art .pn{font-size:.86rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;text-shadow:0 2px 4px rgba(0,0,0,.6);text-align:center;padding:0 6px}
.pack-art .shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 48%,transparent 62%);transform:translateX(-120%);animation:shine 4s infinite}
@keyframes shine{40%,100%{transform:translateX(120%)}}
.pack-tile h3{font-size:1.08rem}
.price{font-weight:700;color:var(--gold);font-size:1.15rem}
.pack-meta{font-size:.8rem;color:var(--dim);text-align:center;min-height:2.4em}
.pity{width:100%}
.pity small{display:flex;justify-content:space-between;color:var(--dim);font-size:.72rem;margin-bottom:3px}
.pack-tile .btns{display:flex;gap:8px;width:100%}
.pack-tile .btns .btn{flex:1}
.pack-tile.locked-p{opacity:.9}
.sale-tag{position:absolute;top:10px;right:-30px;background:var(--bad);padding:2px 34px;transform:rotate(35deg);font-size:.72rem;font-weight:700}
.hero-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:18px}
.dotd{display:flex;gap:14px;align-items:center;padding:14px}
.odds-table{width:100%;border-collapse:collapse;font-size:.9rem}
.odds-table td,.odds-table th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
.odds-table td.r{text-align:right;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--c)}

/* =====================================================================
   CARD (renderCard)
   ===================================================================== */
.card{--cw:150px;--c1:#9aa4b2;--c2:#cfd6e0;--glow:#9aa4b222;--h:200;position:relative;width:var(--cw);aspect-ratio:5/7;font-size:calc(var(--cw)/16);perspective:900px;flex:none;cursor:pointer;-webkit-touch-callout:none}
.card.sz-xs{--cw:92px}.card.sz-sm{--cw:128px}.card.sz-md{--cw:172px}.card.sz-lg{--cw:min(300px,72vw)}.card.sz-xl{--cw:min(340px,78vw,52vh * .714)}
.card .rot{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1));transition:transform .25s ease-out}
.card.tilting .rot{transition:transform .06s linear}
.card .flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.2,.4,1)}
.card.flipped .flip{transform:rotateY(180deg)}
.card .face{position:absolute;inset:0;border-radius:1em;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:#0d0e24}
.card .front{box-shadow:0 .3em 1.2em rgba(0,0,0,.55),0 0 1.4em var(--glow)}
.card .frame{position:absolute;inset:0;border-radius:1em;padding:.42em;background:linear-gradient(135deg,var(--c1),var(--c2) 45%,var(--c1) 70%,var(--c2))}
.card .frame>.inner{position:relative;width:100%;height:100%;border-radius:.7em;overflow:hidden;background:linear-gradient(170deg,hsl(var(--h) 45% 22%),hsl(calc(var(--h) + 40) 50% 10%));display:flex;flex-direction:column}
.card .top{display:flex;justify-content:space-between;align-items:center;padding:.5em .7em .2em;font-size:1em;font-weight:600;z-index:3;position:relative}
.card .top .id{opacity:.85;font-size:.95em}
.card .stars{color:var(--c2);font-size:.82em;letter-spacing:-.05em;text-shadow:0 0 .6em var(--c1)}
.card .art{position:relative;flex:1;margin:.2em .6em;border-radius:.6em;background:radial-gradient(circle at 50% 60%,hsl(var(--h) 80% 55% /.55),hsl(calc(var(--h) + 60) 60% 20% /.7) 70%);overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 1.4em rgba(0,0,0,.6)}
.card .art .dog{font-size:6.2em;filter:drop-shadow(0 .25em .35em rgba(0,0,0,.6));z-index:2;transform:translateY(.1em);line-height:1}
.card .art .mod{position:absolute;right:.4em;top:.3em;font-size:1.9em;z-index:3;filter:drop-shadow(0 0 .3em rgba(0,0,0,.6))}
.card .art .pat{position:absolute;inset:0;opacity:.35;background:repeating-linear-gradient(45deg,transparent 0 .8em,rgba(255,255,255,.12) .8em 1.6em)}
.card .nm{padding:.3em .5em 0;text-align:center;font-weight:700;font-size:1.12em;line-height:1.1;min-height:2.3em;display:flex;align-items:center;justify-content:center;z-index:3;position:relative;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.card .sub{text-align:center;font-size:.8em;color:#d3d6f5;opacity:.85;padding:0 .4em;z-index:3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .rar{margin:.35em .5em .1em;text-align:center;font-weight:700;font-size:.92em;letter-spacing:.06em;text-transform:uppercase;color:#111;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c1));border-radius:99px;padding:.18em .4em;z-index:3;position:relative;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.card .odds{display:flex;justify-content:space-between;padding:.1em .8em .55em;font-size:.78em;color:#cfd2f3;z-index:3;position:relative}
.card .ribbon{position:absolute;z-index:6;left:-.2em;top:1.1em;background:linear-gradient(90deg,#ff3d71,#ff7a45);color:#fff;font-weight:700;font-size:.9em;padding:.15em 1em .15em .6em;border-radius:0 .5em .5em 0;box-shadow:0 .2em .5em rgba(0,0,0,.5);animation:pop .6s}
.card .cnt{position:absolute;z-index:6;right:.5em;bottom:4.9em;background:#000a;border:1px solid var(--c1);border-radius:99px;padding:.1em .6em;font-size:.9em;font-weight:700}
.card .fav{position:absolute;z-index:6;left:.7em;bottom:5em;font-size:1.2em}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.2)}}
/* back */
.card .back{transform:rotateY(180deg)}
.card .back .frame>.inner{padding:.6em .8em;gap:.35em;background:linear-gradient(170deg,#161838,#0b0c20)}
.card .back h4{margin:0;font-size:1.05em;text-align:center}
.card .back .flav{font-size:.82em;font-style:italic;color:#cfd2f3;text-align:center;line-height:1.25}
.card .stat{display:grid;grid-template-columns:5.6em 1fr 1.8em;gap:.4em;align-items:center;font-size:.85em}
.card .stat .sb{height:.6em;border-radius:99px;background:#fff2;overflow:hidden}
.card .stat .sb i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2))}
.card .back .info{font-size:.78em;color:#bfc3ea;display:flex;justify-content:space-between;margin-top:auto}
/* locked / silhouette */
.card.locked .art .dog{filter:brightness(0) opacity(.55);}
.card.locked .nm,.card.locked .sub{opacity:.7}
.card.locked .frame{background:linear-gradient(135deg,#3a3c60,#2a2c4a)}
.card.locked .rar{background:#33365a;color:#8a8db5;text-shadow:none}
.card.locked .stars,.card.locked .odds{opacity:.4}
.card.locked .face{box-shadow:none}
.card.secret.locked .dog{filter:brightness(0);}
/* card down cover */
.card .cover{position:absolute;inset:0;z-index:20;border-radius:1em;background:repeating-linear-gradient(45deg,#2a2370 0 .6em,#1b1650 .6em 1.2em);border:.35em solid var(--c1);display:flex;align-items:center;justify-content:center;transition:opacity .25s,transform .35s}
.card .cover::after{content:"🐾";font-size:4.5em;filter:drop-shadow(0 0 .3em #fff8)}
.card:not(.down) .cover{display:none}
.card.revealing .cover{display:flex;opacity:0;transform:rotateY(90deg)}
/* effect layers */
.fx{position:absolute;inset:0;pointer-events:none;z-index:4;border-radius:.7em;mix-blend-mode:color-dodge;opacity:0}
.card.t4 .fx-holo,.card.t5 .fx-holo,.card.t6 .fx-holo,.card.t7 .fx-holo,.card.t8 .fx-holo,.card.t9 .fx-holo,.card.t10 .fx-holo,.card.t11 .fx-holo,.card.t12 .fx-holo{opacity:.45;background:linear-gradient(115deg,transparent 20%,#ff4d9d88 32%,#ffe14d88 42%,#4dff9d88 52%,#4dc3ff88 62%,#b14dff88 72%,transparent 85%);background-size:250% 250%;background-position:var(--mx,50%) var(--my,50%);animation:holo 6s linear infinite}
@keyframes holo{50%{background-position:100% 100%}}
.card .fx-glare{mix-blend-mode:soft-light;opacity:.0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),#fff 0,#fff0 55%)}
.card.tilting .fx-glare,.card.hov:hover .fx-glare{opacity:.65}
.card .fx-spark{mix-blend-mode:screen}
.card.t6 .fx-spark,.card.t7 .fx-spark,.card.t8 .fx-spark,.card.t9 .fx-spark,.card.t10 .fx-spark,.card.t11 .fx-spark,.card.t12 .fx-spark{opacity:.9;background:radial-gradient(circle at 20% 30%,#fff 0 1px,transparent 2px),radial-gradient(circle at 70% 20%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 40% 70%,#fff 0 1px,transparent 2px),radial-gradient(circle at 85% 65%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 12% 85%,#fff 0 1px,transparent 2px),radial-gradient(circle at 55% 45%,#fff 0 1px,transparent 2px);animation:twinkle 2.2s infinite alternate}
@keyframes twinkle{0%{opacity:.25}100%{opacity:1;transform:scale(1.03)}}
.card .fx-gal{mix-blend-mode:screen}
.card.t8 .fx-gal,.card.t9 .fx-gal,.card.t10 .fx-gal,.card.t11 .fx-gal,.card.t12 .fx-gal{opacity:.6;background:radial-gradient(ellipse at 30% 20%,#7c3aed99,transparent 55%),radial-gradient(ellipse at 75% 70%,#06b6d499,transparent 55%),radial-gradient(circle at 60% 30%,#fff 0 1px,transparent 2px),radial-gradient(circle at 25% 75%,#fff 0 1px,transparent 2px);animation:galx 12s linear infinite;background-size:140% 140%}
@keyframes galx{to{background-position:100% 100%}}
.card.t10 .frame,.card.t11 .frame,.card.t12 .frame{background:conic-gradient(from var(--ang,0deg),#ff3d71,#ffd24a,#4ade80,#22d3ee,#6366f1,#e879f9,#ff3d71);animation:spinang 5s linear infinite}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spinang{to{--ang:360deg}}
.card.t5 .face.front,.card.t6 .face.front{animation:glowp 2.4s infinite alternate}
.card.t7 .face.front,.card.t8 .face.front,.card.t9 .face.front,.card.t10 .face.front,.card.t11 .face.front,.card.t12 .face.front{animation:glowp 1.6s infinite alternate}
@keyframes glowp{from{box-shadow:0 .3em 1.2em rgba(0,0,0,.55),0 0 .8em var(--glow)}to{box-shadow:0 .3em 1.2em rgba(0,0,0,.55),0 0 2.6em var(--c1)}}
.card.t12 .inner{background:radial-gradient(circle at 50% 50%,#1b0030,#000 80%)}
.card.t12 .nm{animation:glitch 3s infinite}
@keyframes glitch{92%{transform:none}93%{transform:translate(-2px,1px);color:#0ff}95%{transform:translate(2px,-1px);color:#f0f}97%{transform:none}}
.card.t11 .inner{background:linear-gradient(170deg,#3a0d00,#120300)}
.card.t10 .inner{background:linear-gradient(170deg,#2a0840,#0b0218)}
.card.t7 .inner,.card.t9 .inner{filter:saturate(1.15) brightness(1.08)}
.card.reduce *{animation:none!important}
body.reduce-fx .card *{animation:none!important}
/* rarity colours */
.t1{--c1:#8c97a8;--c2:#c9d1dc;--glow:#8c97a833}

.bigpack .topstrip::after{content:"";position:absolute;left:0;right:0;top:0;height:22px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 5px,rgba(0,0,0,.3) 5px 10px)}

const Device = {

    if (mm('(hover: none)')) s += 1;
    const tp = nav.maxTouchPoints || 0;
    if (tp > 0 && Math.min(window.innerWidth, window.innerHeight) < 700) s += 1;
    const w = window.innerWidth;
    if (w < 820) s += 3;
    if (/Macintosh/i.test(ua) && tp > 1) s += 2;      // iPadOS meldet sich als Mac
    this.touch = tp > 0 || mm('(pointer: coarse)');
    this.lastScore = s;

  on(f) { this.listeners.push(f); },

  particleScale() { return this.isMobile() ? 0.5 : 1; },
  init() {

    ['(pointer: coarse)', '(hover: none)'].forEach(q => { try { const m = window.matchMedia(q); (m.addEventListener ? m.addEventListener('change', upd) : m.addListener(upd)); } catch (e) { } });

const MAX_LUCK = 10;
const Economy = {
  event: { luckMult: 1, luckUntil: 0, salePct: 0, saleUntil: 0 },
  QUICKSELL: 0.4,
  effLuck() { const e = this.event; return S().luck * (Date.now() < e.luckUntil ? e.luckMult : 1); },

  packPrice(p) { return Math.max(1, Math.round(p.price * (1 - this.salePct()))); },
  unique() { return Object.keys(S().cards).length; },
  total() { return Object.values(S().cards).reduce((a, b) => a + b, 0); },
  collectionValue() { let v = 0; for (const id in S().cards) v += CardDB.get(+id).value * S().cards[id]; return v; },
  add(n, silent) {
    n = Math.floor(n); if (!(n > 0)) return 0;
    const s = S(); s.coins += n; s.stats.earned += n; if (s.coins > s.stats.maxCoins) s.stats.maxCoins = s.coins;
    this.noteAfford(); Bus.emit('coins', n); if (!silent) Store.save(); return n;
  },
  spend(n) {
    n = Math.floor(n); const s = S(); if (!isInt(n) || n < 0 || n > s.coins) return false;
    s.coins -= n; Bus.emit('coins', -n); return true;
  },
  addLuck(d, quiet) {
    const s = S(); if (!(d > 0)) return;
    const f = Math.max(0.15, 1 - (s.luck - 1) / 12);          // abnehmender Zuwachs nahe Maximum
    const before = s.luck; s.luck = clamp(s.luck + d * f, 1, MAX_LUCK);

  },
  softDropLuck() { const s = S(); s.luck = Math.max(1, 1 + (s.luck - 1) * 0.5); Bus.emit('luck', -1); },
  xpNeed(l) { return Math.round(60 * Math.pow(l, 1.6)); },
  addXp(n) {
    const s = S(); s.xp += Math.floor(n);
    while (s.xp >= this.xpNeed(s.level)) {
      s.xp -= this.xpNeed(s.level); s.level++;
      const c = 100 * s.level; this.add(c, true); this.addLuck(0.02);

/* ------------------------------ PACK ENGINE ------------------------------ */
const PITY_MAX = 20;
const PackEngine = {
  weights(pack, luck, pity) {
    const eff = luck * (1 + 0.06 * pity);
    const w = pack.w.map((x, i) => x * Math.pow(eff, i / 8));
    const sum = w.reduce((a, b) => a + b, 0); return w.map(x => x / sum);
  },
  rollTier(probs, minTier, rnd) {
    let tot = 0; for (let t = minTier; t <= 12; t++) tot += probs[t - 1];
    let x = rnd() * tot;
    for (let t = minTier; t <= 12; t++) { x -= probs[t - 1]; if (x <= 0 && probs[t - 1] > 0) return t; }
    for (let t = 12; t >= minTier; t--) if (probs[t - 1] > 0) return t;
    return minTier;
  },
  draw(pack, luck, pity, rnd = Math.random) {
    const probs = this.weights(pack, luck, pity); const tiers = [];
    for (let i = 0; i < pack.count; i++) tiers.push(this.rollTier(probs, i === pack.count - 1 ? pack.minLast : 1, rnd));
    if (pity >= PITY_MAX && Math.max(...tiers) < pack.pityTier) tiers[tiers.length - 1] = this.rollTier(probs, pack.pityTier, rnd);   // Pity-Garantie
    tiers.sort((a, b) => a - b);
    return tiers.map(t => { const arr = CardDB.byTier[t]; return arr[Math.floor(rnd() * arr.length)]; });
  },
  open(packId, opts = {}) {
    const pack = PACK_BY_ID[packId]; if (!pack) return { error: 'unknown' };
    const s = S(); const price = opts.free ? 0 : Economy.packPrice(pack);
    if (!opts.free && s.coins < price) return { error: 'coins', need: price };
    if (!opts.free) Economy.spend(price);
    const luck = Economy.effLuck(), pity = s.pity[packId] || 0;
    const cards = this.draw(pack, luck, pity);
    const res = { pack, price, cards: [], best: null, value: 0, luckBefore: s.luck, dotd: null, bonusCoins: 0 };
    const dotdId = Economy.dotdCard().id; let newCount = 0, rare3 = 0;
    for (const c of cards) {
      const isNew = !s.disc[c.id]; if (isNew) { s.disc[c.id] = Date.now(); newCount++; }
      s.cards[c.id] = (s.cards[c.id] || 0) + 1;
      res.cards.push({ card: c, isNew, count: s.cards[c.id] }); res.value += c.value;
      s.stats.tierPulled[c.tier]++; if (c.tier >= 3) rare3++;
      if (!res.best || c.tier > res.best.tier || (c.tier === res.best.tier && c.value > res.best.value)) res.best = c;
      if (c.id === dotdId && !s.dotd.claimed) { s.dotd = { day: todayStr(), claimed: true }; res.dotd = c; res.bonusCoins = Math.round(c.value * 3); s.stats.dotd++; }
    }
    s.stats.packs++; s.stats.spent += price; s.stats.pulled += cards.length; s.stats.value += res.value; s.stats.newCards += newCount;
    s.stats.packsByType[packId] = (s.stats.packsByType[packId] || 0) + 1;
    if (!s.stats.bestId || res.best.tier > CardDB.get(s.stats.bestId).tier || (res.best.tier === CardDB.get(s.stats.bestId).tier && res.best.value > CardDB.get(s.stats.bestId).value)) { s.stats.bestId = res.best.id; }
    s.stats.bestTier = Math.max(s.stats.bestTier, res.best.tier);
    // Pity
    s.pity[packId] = cards.some(c => c.tier >= pack.pityTier) ? 0 : pity + 1;
    // Luck: Zuwachs pro Pack, Teilrückfall bei sehr seltenen Karten
    const idx = PACKS.indexOf(pack);
    Economy.addLuck(0.012 * (1 + idx * 0.35), true);
    if (res.best.tier >= 6) { Economy.softDropLuck(); res.luckDropped = true; }
    if (res.bonusCoins) { Economy.add(res.bonusCoins, true); Economy.addLuck(0.05, true); }
    Economy.addXp(8 + idx * 5 + newCount * 4 + res.best.tier * 3);
    Quests.progress('packs'); Quests.progress('new', newCount); Quests.progress('rare', rare3); if (price) Quests.progress('spend', price);
    res.luckAfter = s.luck; res.newCount = newCount;
    Ach.check(); Album.checkMilestoneToasts(); Economy.emergTick();
    Store.save(true);                       // Speichern VOR der Animation
    Bus.emit('coins', 0); Bus.emit('luck', 0); Bus.emit('stateChanged');
    return res;
  },
  /* Anzeige: aktuelle Chancen in % */
  chances(pack, packId) { const pity = S().pity[pack.id] || 0; return this.weights(pack, Economy.effLuck(), pity).map(x => x * 100); },
  baseChances(pack) { return this.weights(pack, 1, 0).map(x => x * 100); },
  quickSell(id, n = 1) {
    const s = S(), c = CardDB.get(id); const own = s.cards[id] || 0;
    if (!c || !isInt(n) || n < 1 || own - n < 1) return 0;           // letztes Exemplar bleibt im Album
    s.cards[id] -= n; const coins = Math.floor(c.value * Economy.QUICKSELL) * n;
    Economy.add(coins, true); s.stats.quicksold += n; Quests.progress('sell', n); Ach.check(); Store.save(true); Audio.coins(3);
    Bus.emit('stateChanged'); return coins;
  },
  quickSellAllDupes(maxTier = 12) {
    let tot = 0, n = 0; const s = S();
    for (const k of Object.keys(s.cards)) { const c = CardDB.get(+k); if (c.tier <= maxTier && s.cards[k] > 1) { const q = s.cards[k] - 1; const g = this.quickSell(+k, q); tot += g; n += q; } }
    return { coins: tot, n };
  }
};

/* 3D-Tilt (Maus-Hover, Touch-Drag, optional Gyro) */
const Card3D = {
  attach(cardEl, opts = {}) {

    cardEl.addEventListener('pointerenter', enter); cardEl.addEventListener('pointermove', move); cardEl.addEventListener('pointerleave', leave); cardEl.addEventListener('pointercancel', leave);
    cardEl.addEventListener('pointerdown', e => { enter(); move(e); });

/* ------------------------------ CUTSCENE ------------------------------ */
/* Canvas-2D-Inszenierungen, abhängig von der Seltenheit der besten Karte.

const Cutscene = (() => {
  let root, cv, c, W, H, dpr, parts = [], skipFlag = false, running = false, filterOn = false;
  const R = Math.random, TAU = Math.PI * 2;
  const reduced = () => S().settings.reduceFx || REDUCED_MQ.matches;
  const silCache = {};
  function sil(emoji, px = 220) {
    const k = emoji + px; if (silCache[k]) return silCache[k];
    const o = document.createElement('canvas'); o.width = o.height = px; const x = o.getContext('2d');
    x.font = `${px * 0.78}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(emoji, px / 2, px / 2 + px * 0.05);
    x.globalCompositeOperation = 'source-in'; x.fillStyle = '#000'; x.fillRect(0, 0, px, px); return silCache[k] = o;
  }
  function drawSil(emoji, cx, cy, size, rim, alpha = 1, glow = 28, flip = false) {
    const s = sil(emoji); c.save(); c.globalAlpha = alpha; c.translate(cx, cy); if (flip) c.scale(-1, 1);
    c.shadowColor = rim; c.shadowBlur = glow; c.drawImage(s, -size / 2 - 5, -size / 2 - 5, size, size); c.drawImage(s, -size / 2 + 3, -size / 2 + 3, size, size);
    c.shadowBlur = 0; c.fillStyle = '#000'; c.drawImage(s, -size / 2, -size / 2, size, size); c.restore();
  }
  /* ---------- Partikel ---------- */
  function emit(x, y, n, o = {}) {
    n = Math.ceil(n * Device.particleScale() * (reduced() ? 0.5 : 1)); const cap = Device.isMobile() ? 450 : 900;
    for (let i = 0; i < n && parts.length < cap; i++) {
      const a = (o.angle ?? R() * TAU) + (R() - 0.5) * (o.spread ?? TAU), sp = (o.speed ?? 200) * (0.25 + R() * 0.75);
      parts.push({ x: x + (R() - 0.5) * (o.rx || 0), y: y + (R() - 0.5) * (o.ry || 0), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max: (o.life ?? 1.5) * (0.6 + R() * 0.8), size: (o.size ?? 3) * (0.5 + R()), col: (o.colors || ['#fff'])[Math.floor(R() * (o.colors || [1]).length)], g: o.g ?? 0, drag: o.drag ?? 0.6, shape: o.shape || 'c', rot: R() * TAU, spin: (R() - 0.5) * 8, add: o.add !== false });
    }
  }
  function stepParts(dt, am = 1) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.life += dt; if (p.life >= p.max) { parts.splice(i, 1); continue; }
      const dr = Math.max(0, 1 - p.drag * dt); p.vx *= dr; p.vy *= dr; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.spin * dt;
      const a = (1 - p.life / p.max) * am; c.globalAlpha = a; c.fillStyle = p.col; c.globalCompositeOperation = p.add ? 'lighter' : 'source-over';
      if (p.shape === 'r') { c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillRect(-p.size, -p.size * 0.5, p.size * 2, p.size); c.restore(); }
      else { c.beginPath(); c.arc(p.x, p.y, p.size, 0, TAU); c.fill(); }
    }
    c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  }
  /* ---------- Zeichen-Helfer ---------- */
  const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
  function makeStars(n) { return Array.from({ length: n }, () => ({ x: R(), y: R(), z: 0.2 + R() * 0.8, p: R() * TAU })); }
  function drawStars(stars, t, col = '#fff', warp = 0, cx = W / 2, cy = H / 2) {
    c.fillStyle = col; for (const s of stars) {
      const tw = 0.5 + 0.5 * Math.sin(t * 2 + s.p);

/* ------------------------------ DEV / TESTS ------------------------------ */
const Dev = {
  /* Simuliert n Pulls eines Packs (ohne Spielstand zu verändern) und gibt die Verteilung aus. */
  simulate(packId = 'alpha', n = 100000, luck = 1, usePity = true) {
    const pack = PACK_BY_ID[packId]; if (!pack) { console.error('Unbekanntes Pack', Object.keys(PACK_BY_ID)); return; }
    const counts = new Array(13).fill(0); let value = 0, pity = 0, cards = 0, bestSum = 0;
    for (let i = 0; i < n; i++) {
      const drawn = PackEngine.draw(pack, luck, usePity ? pity : 0); let hit = false;
      for (const c of drawn) { counts[c.tier]++; value += c.value; cards++; if (c.tier >= pack.pityTier) hit = true; }
      pity = hit ? 0 : pity + 1;
    }
    const exp = PackEngine.weights(pack, luck, 0).map(x => x * 100);
    const rows = RAR.slice(1).map(r => ({ Stufe: r.name, Anzahl: counts[r.t], 'Anteil %': +(counts[r.t] / cards * 100).toFixed(4), 'Erwartet % (ohne Pity)': +exp[r.t - 1].toFixed(4) }));
    const sumExp = exp.reduce((a, b) => a + b, 0);
    console.log(`%cSimulation ${pack.name}: ${n} Packs, Luck x${luck}, Pity ${usePity ? 'an' : 'aus'}`, 'font-weight:bold'); console.table(rows);
    const ev = value / n; console.log(`Σ Erwartung = ${sumExp.toFixed(6)} %  ·  Ø Kartenwert/Pack = ${fmt(ev)} (Preis ${fmt(pack.price)} → Wert/Preis ${(ev / pack.price).toFixed(2)}, Quick-Sell ${(ev * Economy.QUICKSELL / pack.price).toFixed(2)})`);
    return { counts, ev, ratio: ev / pack.price, sumExp, rows };
  },
  tables() { PACKS.forEach(p => { const w = PackEngine.baseChances(p), s = w.reduce((a, b) => a + b, 0); console.log(p.name, p.price, w.map(x => x.toFixed(3)).join(' | '), 'Σ=' + s.toFixed(6)); }); },
  /* Prüft Luck-Math und TradeAI-Invarianten */
  selfTest() {
    const out = []; const ok = (name, cond, info = '') => { out.push({ Test: name, OK: !!cond, Info: info }); };
    PACKS.forEach(p => [1, 2.5, 6, 10].forEach(L => { const s = PackEngine.weights(p, L, 0).reduce((a, b) => a + b, 0); ok(`Σ Wahrscheinlichkeit ${p.id} x${L} = 100 %`, Math.abs(s - 1) < 1e-9, s); }));
    const lo = PackEngine.weights(PACK_BY_ID.alpha, 1, 0), hi = PackEngine.weights(PACK_BY_ID.alpha, 8, 0); ok('Luck erhöht Chance auf Mythisch', hi[5] > lo[5], `${lo[5]} → ${hi[5]}`);

    ok('Wert wächst ca. ×3,5 pro Stufe', Math.abs(CardDB.byTier[6].reduce((a, c) => a + c.value, 0) / 60 / (CardDB.byTier[5].reduce((a, c) => a + c.value, 0) / 90) - 3.5) < 0.3);
    ok('999 Karten', CardDB.cards.length === 999);
    console.table(out); const bad = out.filter(o => !o.OK); console.log(bad.length ? '❌ ' + bad.length + ' Tests fehlgeschlagen' : '✅ Alle ' + out.length + ' Tests bestanden'); return bad.length === 0;
  },
